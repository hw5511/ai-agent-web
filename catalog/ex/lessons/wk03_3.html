<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김하늘 — 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f172a; color: #e2e8f0; font-family: 'Inter', 'Noto Sans KR', sans-serif; line-height: 1.6; }
  header, main, footer { max-width: 920px; margin: 0 auto; padding: 0 24px; }
  header { padding-top: 80px; padding-bottom: 48px; }
  header h1 { font-size: 2.6rem; color: #fff; font-weight: 700; }
  header p { color: #94a3b8; margin-top: 8px; }
  section { padding: 48px 24px; }
  section h2 { font-size: 1.4rem; color: #fff; margin-bottom: 20px; }
  #about p { color: #cbd5e1; max-width: 600px; }
  .btn { display: inline-block; margin-top: 20px; background: #38bdf8; color: #0f172a; font-weight: 600; padding: 12px 24px; border-radius: 8px; text-decoration: none; }
  .btn:hover { background: #7dd3fc; }
  .works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; }
  .card img { width: 100%; max-width: none; height: 160px; object-fit: cover; display: block; }
  .card h3 { font-size: 1rem; color: #fff; font-weight: 600; padding: 14px 16px; }
  #contact p { color: #cbd5e1; }
  a { color: #38bdf8; }
  footer { padding: 48px 24px; color: #64748b; border-top: 1px solid #1e293b; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <h1>김하늘</h1>
  <p>그래픽 디자이너 · 포트폴리오</p>
</header>
<main>
  <section id="about">
    <h2>소개</h2>
    <p>브랜드의 첫인상을 만드는 주니어 디자이너입니다. 로고 · 포스터 · 패키지 작업을 합니다.</p>
    <a href="#contact" class="btn">연락하기</a>
  </section>
  <section id="works">
    <h2>작품</h2>
    <div class="works-grid">
      <article class="card">
        <a href="https://example.com" target="_blank" rel="noopener"><img src="https://loremflickr.com/600/400/branding,logo?lock=1" alt="브랜딩 — 동네 카페 로고"></a>
        <h3>브랜딩 — 동네 카페 로고</h3>
      </article>
      <article class="card">
        <a href="https://example.com" target="_blank" rel="noopener"><img src="https://loremflickr.com/600/400/poster,design?lock=2" alt="포스터 — 전시 홍보"></a>
        <h3>포스터 — 전시 홍보</h3>
      </article>
      <article class="card">
        <a href="https://example.com" target="_blank" rel="noopener"><img src="https://loremflickr.com/600/400/package,dessert?lock=3" alt="패키지 — 디저트 박스"></a>
        <h3>패키지 — 디저트 박스</h3>
      </article>
      <article class="card">
        <a href="https://example.com" target="_blank" rel="noopener"><img src="https://loremflickr.com/600/400/website,minimal?lock=4" alt="웹 — 원페이지 사이트"></a>
        <h3>웹 — 원페이지 사이트</h3>
      </article>
    </div>
  </section>
  <section id="contact">
    <h2>연락처</h2>
    <p>이메일: haneul.kim@example.com</p>
  </section>
</main>
<footer>
  <p>&copy; 2026 김하늘</p>
</footer>
</body>
</html>
