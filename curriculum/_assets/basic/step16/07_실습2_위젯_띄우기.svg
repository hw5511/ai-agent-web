<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 16</text>
  <rect x="144" y="44" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d1d5db" stroke-width="1"/>
  <text x="170" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.05em">실습 2</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 ② — 결제 위젯 띄우기</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">"결제하기" 버튼을 누르면 토스 결제창이 뜹니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Claude 지시문 박스 -->
  <rect x="60" y="240" width="1160" height="104" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="84" y="258" width="104" height="22" rx="11" fill="#2563eb"/>
  <text x="136" y="273" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Claude 지시문</text>
  <text x="84" y="310" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#1e40af">"토스 결제 위젯을 내 사이트에 추가해줘. 결제하기 버튼을 누르면 위젯이 뜨고,</text>
  <text x="84" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#1e40af">테스트 카드로 결제 시도 가능하도록."</text>

  <text x="60" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">이 지시문의 핵심</text>

  <!-- 좌측 핵심 2박스 -->
  <rect x="60" y="408" width="565" height="62" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="84" y="438" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#15803d">클라이언트 키는 화면에 박아도 OK</text>
  <text x="84" y="460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">공개 키라서 안전 — 시크릿 키는 아직 안 씁니다</text>

  <rect x="60" y="478" width="565" height="62" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="84" y="508" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#92400e">결제 누르면 잠시 후 결과 페이지로</text>
  <text x="84" y="530" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#78350f">성공·실패 페이지는 다음 실습에서 만듭니다</text>

  <!-- 우측 위젯 모달 목업 -->
  <rect x="655" y="408" width="565" height="132" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="655" y="408" width="565" height="34" rx="12" fill="#0f172a"/>
  <rect x="655" y="424" width="565" height="18" fill="#0f172a"/>
  <text x="679" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">토스 결제</text>
  <rect x="679" y="456" width="517" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="691" y="473" font-family="'Courier New',monospace" font-size="13" fill="#9ca3af">4242 4242 4242 4242  (테스트 카드)</text>
  <rect x="679" y="490" width="250" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="691" y="507" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#9ca3af">유효기간 · CVC · 할부</text>
  <rect x="943" y="490" width="253" height="26" rx="6" fill="#2563eb"/>
  <text x="1069" y="507" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">결제하기</text>

  <!-- 팁 박스 -->
  <rect x="60" y="552" width="1160" height="46" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="84" y="580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">테스트 카드 번호는 토스 개발자 문서 → 테스트 카드 페이지에서 복사  ·  실제 청구 X — 안심하고 여러 번 눌러보기</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">결제 눌렀는데 에러? 아직 검증 함수가 없어서 그래요 — 다음 슬라이드에서 만듭니다</text>
</svg>
