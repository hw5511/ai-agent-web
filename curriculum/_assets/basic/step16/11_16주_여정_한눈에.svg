<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 16</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">16주 여정 한눈에</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">검은 글씨 페이지에서 결제 사이트까지 — 본인이 얼마나 왔는지 봅니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">4단계 · 16회차</text>

  <!-- 4그룹 행 (각 행에 4칸) -->
  <!-- 그룹 1: 1~4 노랑 -->
  <rect x="60" y="262" width="1160" height="68" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="84" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#d97706">1~4회차 · Part 1 기초</text>
  <text x="84" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#92400e">HTML · CSS · JS · 랜딩페이지 — 첫 화면을 직접 만들기</text>
  <rect x="980" y="278" width="216" height="36" rx="8" fill="#fde68a"/>
  <text x="1088" y="302" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#78350f">웹의 뼈대 익히기</text>

  <!-- 그룹 2: 5~8 파랑 -->
  <rect x="60" y="342" width="1160" height="68" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="84" y="370" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#2563eb">5~8회차 · Part 2 기초</text>
  <text x="84" y="396" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e40af">도메인 · Vercel · 외부 데이터 · Claude와 친해지기 — 인터넷에 올리기</text>
  <rect x="980" y="358" width="216" height="36" rx="8" fill="#bfdbfe"/>
  <text x="1088" y="382" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">공개 주소 갖기</text>

  <!-- 그룹 3: 9~12 초록 -->
  <rect x="60" y="422" width="1160" height="68" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="84" y="450" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#16a34a">9~12회차 · 심화 Part 1</text>
  <text x="84" y="476" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#15803d">다중 페이지 · 데이터 저장 · 회원 · 데이터 관리 — 사라지지 않는 사이트</text>
  <rect x="980" y="438" width="216" height="36" rx="8" fill="#bbf7d0"/>
  <text x="1088" y="462" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#166534">데이터 다루기</text>

  <!-- 그룹 4: 13~16 보라 -->
  <rect x="60" y="502" width="1160" height="68" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="84" y="530" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#7c3aed">13~16회차 · 심화 Part 2</text>
  <text x="84" y="556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6d28d9">AI 기능 · 이미지 · 고도화 · 결제 — 본인 도메인 + DB + 회원 + AI + 결제 도는 사이트</text>
  <rect x="980" y="518" width="216" height="36" rx="8" fill="#e9d5ff"/>
  <text x="1088" y="542" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9">지금 여기 — 완주</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">코드 한 줄 못 쓰던 분들이 지금 결제까지 붙이고 있습니다 — 진짜 잘하셨어요</text>
</svg>
