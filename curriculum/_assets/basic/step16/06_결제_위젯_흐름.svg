<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs><style>@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css");</style></defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 16</text>

  <text x="60" y="130" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717" letter-spacing="-0.01em">결제 위젯 흐름 한눈에</text>
  <text x="60" y="178" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#6b7280">버튼 클릭에서 DB 저장까지 다섯 단계</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <g font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <rect x="60" y="290" width="200" height="140" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="78" y="324" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">01</text>
    <text x="78" y="362" font-size="20" font-weight="700" fill="#171717">SDK 로드</text>
    <text x="78" y="392" font-size="14" font-weight="400" fill="#6b7280">토스 스크립트</text>
    <text x="78" y="412" font-size="14" font-weight="400" fill="#6b7280">한 줄 추가</text>

    <text x="277" y="368" font-size="28" fill="#9ca3af">→</text>

    <rect x="304" y="290" width="200" height="140" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="322" y="324" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">02</text>
    <text x="322" y="362" font-size="20" font-weight="700" fill="#171717">위젯 생성</text>
    <text x="322" y="392" font-size="14" font-weight="400" fill="#6b7280">결제 영역</text>
    <text x="322" y="412" font-size="14" font-weight="400" fill="#6b7280">화면에 띄우기</text>

    <text x="521" y="368" font-size="28" fill="#9ca3af">→</text>

    <rect x="548" y="290" width="200" height="140" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="566" y="324" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">03</text>
    <text x="566" y="362" font-size="20" font-weight="700" fill="#171717">결제 요청</text>
    <text x="566" y="392" font-size="14" font-weight="400" fill="#6b7280">사용자가 카드</text>
    <text x="566" y="412" font-size="14" font-weight="400" fill="#6b7280">정보 입력</text>

    <text x="765" y="368" font-size="28" fill="#9ca3af">→</text>

    <rect x="792" y="290" width="200" height="140" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="810" y="324" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">04</text>
    <text x="810" y="362" font-size="20" font-weight="700" fill="#171717">Vercel 검증</text>
    <text x="810" y="392" font-size="14" font-weight="400" fill="#6b7280">시크릿 키로</text>
    <text x="810" y="412" font-size="14" font-weight="400" fill="#6b7280">토스에 재확인</text>

    <text x="1009" y="368" font-size="28" fill="#9ca3af">→</text>

    <rect x="1036" y="290" width="184" height="140" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="1054" y="324" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">05</text>
    <text x="1054" y="362" font-size="20" font-weight="700" fill="#171717">DB 저장</text>
    <text x="1054" y="392" font-size="14" font-weight="400" fill="#6b7280">주문 기록 +</text>
    <text x="1054" y="412" font-size="14" font-weight="400" fill="#6b7280">결과 페이지</text>
  </g>

  <text x="60" y="475" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">01 — 03  브라우저 영역      ·      04 — 05  Vercel 함수 영역</text>

  <text x="60" y="580" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#171717">왜 검증을 한 번 더 하는가</text>
  <text x="60" y="624" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#374151">브라우저는 사용자가 만질 수 있다  ·  결제 성공이라고 거짓말이 가능하다</text>
  <text x="60" y="660" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" fill="#16a34a">반드시 Vercel 함수에서 토스에 다시 물어본다</text>
</svg>
