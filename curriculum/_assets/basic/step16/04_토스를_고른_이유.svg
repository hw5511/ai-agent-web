  <text x="60" y="635" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" fill="#171717">오늘은 테스트 키만으로 끝까지 갑니다</text>
