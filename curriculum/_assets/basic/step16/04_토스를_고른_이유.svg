    <text x="104" y="402" font-size="15" font-weight="400" fill="#6b7280">막힐 때 검색이 잘 됨</text>

    <rect x="365" y="270" width="265" height="160" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="389" y="306" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">02</text>
    <text x="389" y="346" font-size="22" font-weight="700" fill="#171717">테스트 키 즉시</text>
    <text x="389" y="380" font-size="15" font-weight="400" fill="#6b7280">사업자 등록 X</text>
    <text x="389" y="402" font-size="15" font-weight="400" fill="#6b7280">이메일 가입만으로 발급</text>

    <rect x="650" y="270" width="265" height="160" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="674" y="306" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">03</text>
    <text x="674" y="346" font-size="22" font-weight="700" fill="#171717">위젯 SDK 한 줄</text>
