<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs><style>@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css");</style></defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 16</text>

  <text x="60" y="130" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717" letter-spacing="-0.01em">PG가 무엇이고 왜 필요한가</text>
  <text x="60" y="178" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#6b7280">카드 결제를 대신 처리해주는 회사</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 흐름도 -->
  <g font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <rect x="100" y="290" width="240" height="120" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="220" y="335" text-anchor="middle" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">FRONT</text>
    <text x="220" y="370" text-anchor="middle" font-size="22" font-weight="700" fill="#171717">내 사이트</text>

    <text x="380" y="362" text-anchor="middle" font-size="32" font-weight="400" fill="#9ca3af">→</text>

    <rect x="420" y="290" width="240" height="120" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="540" y="335" text-anchor="middle" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">MIDDLE</text>
    <text x="540" y="370" text-anchor="middle" font-size="22" font-weight="700" fill="#171717">PG</text>
    <text x="540" y="394" text-anchor="middle" font-size="14" font-weight="400" fill="#6b7280">결제 중개 서비스</text>

    <text x="700" y="362" text-anchor="middle" font-size="32" font-weight="400" fill="#9ca3af">→</text>

    <rect x="740" y="290" width="240" height="120" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="860" y="335" text-anchor="middle" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">END</text>
    <text x="860" y="370" text-anchor="middle" font-size="22" font-weight="700" fill="#171717">카드사 · 은행</text>
  </g>

  <text x="80" y="490" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#9ca3af">─</text>
  <text x="120" y="490" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#374151">개인이 카드사와 직접 계약하는 건 사실상 불가능</text>

  <text x="80" y="528" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#9ca3af">─</text>
  <text x="120" y="528" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#374151">PG가 가운데서 카드 연동 · 보안 · 정산을 다 맡아줌</text>

  <text x="80" y="566" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#9ca3af">─</text>
  <text x="120" y="566" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#374151">한국 주요 PG  ·  토스페이먼츠 / 이니시스 / NHN KCP</text>

  <!-- 큰 메시지 -->
  <text x="60" y="660" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="600" fill="#16a34a">우리는 SDK 한 줄만 붙이면 끝</text>
</svg>
