<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 16</text>
  <rect x="144" y="44" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d1d5db" stroke-width="1"/>
  <text x="170" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.05em">실습 1</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 ① — 토스 테스트 키 발급</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">가입 → 개발자 센터 → 테스트 키 2개를 손에 넣습니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">학생 직접 진행 — 3단계</text>

  <!-- 3단계 흐름 -->
  <rect x="60" y="272" width="340" height="78" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="230" y="306" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#374151">① 가입</text>
  <text x="230" y="332" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">tosspayments.com (이메일만)</text>

  <text x="428" y="318" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" fill="#9ca3af">→</text>

  <rect x="456" y="272" width="340" height="78" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="626" y="306" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#1e40af">② 개발자 센터</text>
  <text x="626" y="332" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#1e40af">테스트 키 메뉴 들어가기</text>

  <text x="824" y="318" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" fill="#9ca3af">→</text>

  <rect x="852" y="272" width="340" height="78" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="1022" y="306" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#15803d">③ 키 복사</text>
  <text x="1022" y="332" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#15803d">메모장에 임시 저장</text>

  <text x="60" y="402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">받아야 하는 키 2종</text>

  <!-- 키 2종 카드 -->
  <rect x="60" y="422" width="565" height="96" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="84" y="456" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#15803d">클라이언트 키 — 공개해도 OK</text>
  <text x="84" y="482" font-family="'Courier New',monospace" font-size="14" fill="#166534">test_ck_••••</text>
  <text x="84" y="506" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">브라우저(내 페이지 화면)에서 쓰는 키</text>

  <rect x="655" y="422" width="565" height="96" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="679" y="456" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#b91c1c">시크릿 키 — 절대 노출 금지</text>
  <text x="679" y="482" font-family="'Courier New',monospace" font-size="14" fill="#991b1b">test_sk_••••</text>
  <text x="679" y="506" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#991b1b">Vercel 함수에서만 쓰는 비밀 키</text>

  <!-- 경고 박스 -->
  <rect x="60" y="538" width="1160" height="58" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <polygon points="92,552 104,576 80,576" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-linejoin="round"/>
  <rect x="91" y="560" width="2" height="8" fill="#dc2626"/>
  <rect x="91" y="571" width="2" height="2" fill="#dc2626"/>
  <text x="120" y="574" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#991b1b">시크릿 키는 채팅 창·코드 화면에 절대 붙여넣지 마세요 — 다음 실습에서 Vercel 환경변수로 등록합니다</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">토스 회원가입은 Claude가 못 합니다 — 키 복사하다 막히면 손드세요</text>
</svg>
