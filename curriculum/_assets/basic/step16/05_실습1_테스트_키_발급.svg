  <text x="120" y="460" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="500" fill="#171717">테스트 시크릿 키를 복사한다  ·  절대 노출 금지</text>

