  <text x="120" y="410" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="500" fill="#171717">테스트 클라이언트 키를 복사한다  ·  공개해도 되는 키</text>

