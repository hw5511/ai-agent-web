<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs><style>@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css");</style></defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 16</text>

  <text x="60" y="130" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717" letter-spacing="-0.01em">다음 코스 안내</text>
  <text x="60" y="178" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#6b7280">본인 관심사에 따라 한 갈래 선택</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <g font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <rect x="60" y="270" width="375" height="290" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="84" y="306" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">TRACK 01</text>
    <text x="84" y="350" font-size="26" font-weight="700" fill="#171717">웹이론</text>
    <text x="84" y="384" font-size="15" font-weight="500" fill="#6b7280">4개월</text>
    <line x1="84" y1="408" x2="411" y2="408" stroke="#e5e7eb" stroke-width="1"/>
    <text x="84" y="446" font-size="17" font-weight="500" fill="#374151">HTML · CSS · JS 본격</text>
    <text x="84" y="476" font-size="17" font-weight="500" fill="#374151">코드 직접 읽고 쓰기</text>
    <text x="84" y="528" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.05em">Claude 없이도 코드 이해</text>

    <rect x="452.5" y="270" width="375" height="290" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="476.5" y="306" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">TRACK 02</text>
    <text x="476.5" y="350" font-size="26" font-weight="700" fill="#171717">406 바이브코딩</text>
    <text x="476.5" y="384" font-size="15" font-weight="500" fill="#6b7280">컴포넌트 · 상태관리</text>
    <line x1="476.5" y1="408" x2="803.5" y2="408" stroke="#e5e7eb" stroke-width="1"/>
    <text x="476.5" y="446" font-size="17" font-weight="500" fill="#374151">복잡한 앱 본격 제작</text>
    <text x="476.5" y="476" font-size="17" font-weight="500" fill="#374151">화면 단위 사고</text>
    <text x="476.5" y="528" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.05em">큰 서비스 만들고 싶다면</text>

    <rect x="845" y="270" width="375" height="290" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="869" y="306" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">TRACK 03</text>
    <text x="869" y="350" font-size="26" font-weight="700" fill="#171717">416 자동화 PM</text>
    <text x="869" y="384" font-size="15" font-weight="500" fill="#6b7280">n8n · 도구 활용</text>
    <line x1="869" y1="408" x2="1196" y2="408" stroke="#e5e7eb" stroke-width="1"/>
    <text x="869" y="446" font-size="17" font-weight="500" fill="#374151">코드 안 쓰고 자동화</text>
    <text x="869" y="476" font-size="17" font-weight="500" fill="#374151">사업 운영 시각</text>
    <text x="869" y="528" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.05em">기획 · 운영 강한 사람용</text>
