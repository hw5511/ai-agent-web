  <rect x="60" y="600" width="80" height="3" rx="1.5" fill="#16a34a"/>

  <text x="60" y="654" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#374151">본 코스 수료자 할인 안내  ·  등록 상담은 발표 종료 후 따로</text>
