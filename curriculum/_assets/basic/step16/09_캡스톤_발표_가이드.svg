<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs><style>@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css");</style></defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 16</text>

  <text x="60" y="130" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717" letter-spacing="-0.01em">캡스톤 발표 가이드</text>
  <text x="60" y="178" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#6b7280">1인 5분  ·  정확히 지킨다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <g font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="60" y="266" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">5 MIN TIMELINE</text>

    <rect x="60" y="290" width="232" height="36" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="296" y="290" width="696" height="36" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="996" y="290" width="224" height="36" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

    <text x="176" y="313" text-anchor="middle" font-size="14" font-weight="600" fill="#6b7280">0:00 — 1:00</text>
    <text x="644" y="313" text-anchor="middle" font-size="14" font-weight="600" fill="#6b7280">1:00 — 4:00</text>
    <text x="1108" y="313" text-anchor="middle" font-size="14" font-weight="600" fill="#6b7280">4:00 — 5:00</text>

    <text x="176" y="358" text-anchor="middle" font-size="20" font-weight="700" fill="#171717">주제 소개</text>
    <text x="644" y="358" text-anchor="middle" font-size="20" font-weight="700" fill="#171717">도메인 시연</text>
    <text x="1108" y="358" text-anchor="middle" font-size="20" font-weight="700" fill="#171717">회고</text>
  </g>

  <text x="80" y="430" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#9ca3af">─</text>
  <text x="120" y="430" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#374151">주제 소개  ·  어떤 사이트인가 / 누구를 위한 건가</text>

  <text x="80" y="470" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#9ca3af">─</text>
  <text x="120" y="470" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#374151">시연  ·  본인 도메인에서 로그인 → AI 기능 → 결제까지 직접 보여주기</text>

  <text x="80" y="510" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#9ca3af">─</text>
  <text x="120" y="510" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#374151">회고  ·  가장 어려웠던 점 1개 / 다음에 추가하고 싶은 기능 1개</text>

  <text x="80" y="550" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#9ca3af">─</text>
  <text x="120" y="550" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#374151">청중은 박수 + 한 줄 질문 1개</text>

  <text x="60" y="640" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" fill="#16a34a">긴장되면 본인 도메인 주소부터 띄우고 시작 — 흐름이 자동으로 잡힌다</text>
</svg>
