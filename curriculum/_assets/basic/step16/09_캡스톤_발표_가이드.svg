<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 16</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">캡스톤 발표 가이드 — 1인 5분</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">완벽한 발표 X — 본인이 만든 걸 자랑하는 시간입니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">5분 타임라인</text>

  <!-- 타임라인 막대 3구간 -->
  <rect x="60" y="270" width="232" height="48" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="176" y="299" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#92400e">0:00 ~ 1:00  주제 소개</text>
  <rect x="296" y="270" width="696" height="48" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="644" y="299" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1e40af">1:00 ~ 4:00  도메인 시연 (로그인 · AI 기능 · 결제까지)</text>
  <rect x="996" y="270" width="224" height="48" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="1108" y="299" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#15803d">4:00 ~ 5:00  회고</text>

  <text x="60" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">발표 체크리스트</text>

  <!-- 3카드 -->
  <rect x="60" y="382" width="366" height="160" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="84" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#92400e">주제 소개</text>
  <line x1="84" y1="434" x2="402" y2="434" stroke="#fcd34d" stroke-width="1"/>
  <text x="84" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#92400e">• 어떤 사이트인지</text>
  <text x="84" y="494" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#92400e">• 누구를 위한 건지</text>
  <text x="84" y="522" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#92400e">• 한 문장으로 요약</text>

  <rect x="457" y="382" width="366" height="160" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="481" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#1e40af">도메인 시연</text>
  <line x1="481" y1="434" x2="799" y2="434" stroke="#93c5fd" stroke-width="1"/>
  <text x="481" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e40af">• 본인 도메인 직접 열기</text>
  <text x="481" y="494" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e40af">• 로그인 · AI 기능 보여주기</text>
  <text x="481" y="522" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e40af">• 결제까지 눌러보기</text>

  <rect x="854" y="382" width="366" height="160" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="878" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#15803d">회고</text>
  <line x1="878" y1="434" x2="1196" y2="434" stroke="#86efac" stroke-width="1"/>
  <text x="878" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#15803d">• 가장 어려웠던 점 1개</text>
  <text x="878" y="494" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#15803d">• 다음에 추가할 기능 1개</text>
  <text x="878" y="522" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#15803d">• 청중 박수 + 질문 1개</text>

  <!-- 팁 박스 -->
  <rect x="60" y="552" width="1160" height="46" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="84" y="580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">긴장되면 본인 도메인 주소부터 띄우고 시작 — 화면이 뜨면 자동으로 발표 흐름이 잡힙니다</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">안 되는 기능 있어도 OK — "여기는 못 만들었어요" 솔직하게 말하면 됩니다</text>
</svg>
