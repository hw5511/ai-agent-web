  <text x="790" y="378" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="32" font-weight="700" fill="#171717">서울</text>

  <text x="790" y="476" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="68" font-weight="700" fill="#171717">22°</text>

  <line x1="790" y1="514" x2="1190" y2="514" stroke="#e5e7eb" stroke-width="1"/>

