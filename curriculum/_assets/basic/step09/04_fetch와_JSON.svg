<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 09</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">개념 ② — fetch와 JSON</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">한 줄 명령(fetch) + 데이터의 모양(JSON), 두 단어만 기억하세요</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">데이터를 받는 흐름</text>

  <!-- 5단계 흐름 칩 -->
  <rect x="60" y="278" width="180" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="150" y="310" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">주소 URL</text>
  <text x="256" y="311" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#9ca3af">→</text>
  <rect x="272" y="278" width="160" height="52" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="352" y="310" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#15803d">fetch</text>
  <text x="448" y="311" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#9ca3af">→</text>
  <rect x="464" y="278" width="160" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="544" y="310" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">응답</text>
  <text x="640" y="311" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#9ca3af">→</text>
  <rect x="656" y="278" width="180" height="52" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="746" y="310" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#92400e">JSON 풀기</text>
  <text x="852" y="311" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#9ca3af">→</text>
  <rect x="868" y="278" width="180" height="52" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="958" y="310" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1e40af">화면 표시</text>

  <!-- 좌측 설명 2박스 -->
  <rect x="60" y="364" width="560" height="100" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="84" y="402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#15803d">fetch</text>
  <text x="84" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">브라우저에 기본 탑재된 명령</text>
  <text x="84" y="454" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">주소 URL에 데이터를 달라고 부탁한다</text>

  <rect x="60" y="478" width="560" height="100" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="84" y="516" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#92400e">JSON</text>
  <text x="84" y="546" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#78350f">이름표 + 값 쌍으로 된 데이터 형식</text>
  <text x="84" y="568" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#78350f">사람도 읽을 수 있는 메모지</text>

  <!-- 우측 코드박스 (보여주기용) -->
  <rect x="660" y="364" width="560" height="118" rx="12" fill="#0f172a"/>
  <text x="684" y="396" font-family="'Courier New',monospace" font-size="14" fill="#6b7280">// 보여주기용 — 외우지 않아도 됩니다</text>
  <text x="684" y="426" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">const res = await fetch("주소 URL");</text>
  <text x="684" y="454" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">const data = await res.json();</text>

  <!-- JSON 샘플 박스 -->
  <rect x="660" y="496" width="560" height="82" rx="12" fill="#0f172a"/>
  <text x="684" y="528" font-family="'Courier New',monospace" font-size="14" fill="#6b7280">// JSON 샘플 — 이름표 + 값</text>
  <text x="684" y="558" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">{ "city": "Seoul", "temp": 22 }</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">코드는 클로드가 짭니다 — 우리는 "아, fetch로 받는 거구나" 알아보기만 하면 됩니다</text>
</svg>
