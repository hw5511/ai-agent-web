<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 02</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">2회차 핵심 정리</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">오늘 배운 것 3가지 — 그리고 다음 주로 연결</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 카드 1 노랑 -->
  <rect x="60" y="244" width="360" height="288" rx="16" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <text x="88" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="36" font-weight="900" fill="#d97706">01</text>
  <text x="88" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="21" font-weight="700" fill="#92400e">HTML은 뼈대</text>
  <line x1="88" y1="362" x2="392" y2="362" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="240" y="398" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#78350f">보이지 않지만</text>
  <text x="240" y="424" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#78350f">모든 화면의 기초</text>
  <text x="240" y="450" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#78350f">브라우저가 처음 읽는 것</text>
  <text x="240" y="508" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#d97706">검은 글씨가 정상</text>

  <!-- 카드 2 파랑 -->
  <rect x="460" y="244" width="360" height="288" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="488" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="36" font-weight="900" fill="#2563eb">02</text>
  <text x="488" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="21" font-weight="700" fill="#1e40af">시맨틱 태그 5종</text>
  <line x1="488" y1="362" x2="792" y2="362" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="640" y="398" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e3a8a">header · main · section</text>
  <text x="640" y="424" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e3a8a">article · footer</text>
  <text x="640" y="450" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e3a8a">의미 단위로 영역 나누기</text>
  <text x="640" y="508" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#2563eb">외우지 말고 알아보기만</text>

  <!-- 카드 3 초록 -->
  <rect x="860" y="244" width="360" height="288" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="888" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="36" font-weight="900" fill="#16a34a">03</text>
  <text x="888" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="21" font-weight="700" fill="#15803d">스타일 없이 구조만</text>
  <line x1="888" y1="362" x2="1192" y2="362" stroke="#86efac" stroke-width="1.5"/>
  <text x="1040" y="398" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">지시할 때 꼭 붙이는 한 마디</text>
  <text x="1040" y="424" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">구조와 디자인 분리 원칙</text>
  <text x="1040" y="450" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">수정할 때 한쪽만 건드림</text>
  <text x="1040" y="508" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#16a34a">내 랜딩페이지 뼈대 완성</text>

  <!-- 진행 바 + 산출물 -->
  <rect x="60" y="552" width="1160" height="48" rx="10" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="84" y="582" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">오늘 산출물 — 내 랜딩페이지 HTML 뼈대 완성  ·  진행 2 / 16  →  다음 3 / 16</text>
  <text x="1196" y="582" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2563eb">이 파일 절대 지우지 마세요</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">다음 3회차 — CSS, 웹에 옷을 입히다  ·  오늘 만든 뼈대에 색·여백·폰트 넣기</text>
</svg>
