<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><style>@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css");</style></defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 02</text>

  <text x="60" y="130" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">구조와 디자인 분리</text>
  <text x="60" y="178" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">뼈대(와이어프레임)는 그대로, 디자인(옷)만 갈아입힌다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="262" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">하나의 뼈대 · 세 가지 옷</text>

  <!-- 뼈대 (좌) -->
  <rect x="60" y="300" width="220" height="260" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="170" y="338" text-anchor="middle" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">와이어프레임 = 뼈대</text>
  <rect x="92" y="362" width="156" height="18" rx="2" fill="#e5e7eb"/>
  <rect x="92" y="392" width="156" height="50" rx="2" fill="#e5e7eb"/>
  <rect x="92" y="454" width="100" height="14" rx="2" fill="#e5e7eb"/>
  <rect x="92" y="478" width="156" height="14" rx="2" fill="#e5e7eb"/>
  <rect x="92" y="502" width="120" height="14" rx="2" fill="#e5e7eb"/>
  <text x="170" y="546" text-anchor="middle" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">색·폰트 없이 영역만 잡은 설계도</text>

  <!-- 화살표 -->
  <text x="312" y="438" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="32" fill="#9ca3af">→</text>

  <!-- 스타일 A -->
  <rect x="360" y="300" width="270" height="260" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="495" y="338" text-anchor="middle" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">스타일 A · 미니멀</text>
  <line x1="384" y1="362" x2="606" y2="362" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="392" y="382" width="180" height="14" rx="2" fill="#374151"/>
  <rect x="392" y="408" width="120" height="10" rx="2" fill="#9ca3af"/>
  <rect x="392" y="438" width="206" height="56" rx="4" fill="#f9fafb"/>
  <rect x="392" y="510" width="80" height="22" rx="2" fill="#171717"/>

  <!-- 스타일 B -->
  <rect x="660" y="300" width="270" height="260" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="795" y="338" text-anchor="middle" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">스타일 B · 둥근</text>
  <line x1="684" y1="362" x2="906" y2="362" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="692" y="382" width="160" height="14" rx="7" fill="#171717"/>
  <rect x="692" y="408" width="140" height="10" rx="5" fill="#9ca3af"/>
  <rect x="692" y="438" width="206" height="56" rx="16" fill="#f9fafb"/>
  <rect x="692" y="510" width="100" height="22" rx="11" fill="#374151"/>

  <!-- 스타일 C -->
  <rect x="960" y="300" width="260" height="260" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="1090" y="338" text-anchor="middle" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">스타일 C · 또렷한</text>
  <line x1="984" y1="362" x2="1196" y2="362" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="992" y="382" width="200" height="18" fill="#171717"/>
  <rect x="992" y="412" width="100" height="10" fill="#6b7280"/>
  <rect x="992" y="438" width="200" height="56" fill="#f9fafb"/>
  <rect x="992" y="510" width="120" height="26" fill="#171717"/>

  <!-- 하단 그린 강조 -->
  <text x="60" y="630" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">실무 원칙</text>
  <text x="60" y="670" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" fill="#16a34a">구조 수정과 스타일 수정을 분리해서 말하기</text>
</svg>
