<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 02</text>
  <rect x="144" y="44" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d1d5db" stroke-width="1"/>
  <text x="170" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.05em">실습 1</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 ① — 첫 뼈대 생성</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">"스타일 없이 구조만" 한 마디로 첫 HTML 뼈대를 만듭니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Claude 지시문 박스 -->
  <rect x="60" y="240" width="700" height="108" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="84" y="258" width="104" height="22" rx="11" fill="#2563eb"/>
  <text x="136" y="273" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Claude 지시문</text>
  <text x="84" y="310" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#1e40af">"내 이름, 직업, 소개글, 연락 버튼이 있는 랜딩페이지</text>
  <text x="84" y="335" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#1e40af">HTML 뼈대를 만들어줘. 스타일은 없이 구조만."</text>

  <!-- 우측: 결과 미리보기 목업 (검은 글씨 페이지) -->
  <rect x="780" y="240" width="440" height="262" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="780" y="240" width="440" height="30" rx="12" fill="#f3f4f6"/>
  <circle cx="800" cy="255" r="4" fill="#d1d5db"/>
  <circle cx="816" cy="255" r="4" fill="#d1d5db"/>
  <circle cx="832" cy="255" r="4" fill="#d1d5db"/>
  <text x="1196" y="260" text-anchor="end" font-family="'Courier New',monospace" font-size="12" fill="#9ca3af">index.html</text>
  <text x="804" y="312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#171717">홍길동</text>
  <text x="804" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#171717">웹 디자이너</text>
  <text x="804" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#171717">안녕하세요. 저는 만드는 것을 좋아합니다.</text>
  <text x="804" y="394" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#171717">간단한 소개글이 여기에 들어갑니다.</text>
  <rect x="804" y="416" width="92" height="30" rx="2" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
  <text x="850" y="436" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#171717">연락하기</text>
  <text x="804" y="478" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">검은 글씨 · 흰 배경 — 당황 금지</text>

  <!-- 핵심 포인트 박스 -->
  <rect x="60" y="372" width="700" height="58" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="84" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#92400e">핵심은 "스타일 없이" — 이 한 마디가 순수한 구조만 나오게 합니다</text>

  <rect x="60" y="442" width="700" height="60" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="84" y="478" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">구체 항목(이름·직업·소개·버튼)만 말하면 알아서 태그로 배치합니다</text>

  <!-- 연습해보세요 박스 -->
  <rect x="60" y="512" width="1160" height="84" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="84" y="530" width="104" height="22" rx="11" fill="#16a34a"/>
  <text x="136" y="545" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">못생긴 게 정상</text>
  <text x="84" y="578" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">• 멋대로 스타일이 들어가면  → "스타일 다 빼고 구조만 다시"라고 한 번 더 말하세요</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">검은 글씨가 떴다면 성공 — 옷은 다음 주에 입힙니다</text>
</svg>
