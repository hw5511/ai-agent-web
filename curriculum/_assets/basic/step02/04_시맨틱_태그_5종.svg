<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 02</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">시맨틱 태그 5종</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">header · main · section · article · footer — 의미 단위 영역 이름표</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 좌측: 5행 표 -->
  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">태그 / 의미</text>

  <rect x="60" y="276" width="640" height="58" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="84" y="312" font-family="'Courier New',monospace" font-size="18" font-weight="700" fill="#1e40af">header</text>
  <text x="240" y="312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">페이지 상단 — 로고·메뉴 자리</text>

  <rect x="60" y="342" width="640" height="58" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="84" y="378" font-family="'Courier New',monospace" font-size="18" font-weight="700" fill="#374151">main</text>
  <text x="240" y="378" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">본문 전체를 감싸는 컨테이너</text>

  <rect x="60" y="408" width="640" height="58" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="84" y="444" font-family="'Courier New',monospace" font-size="18" font-weight="700" fill="#15803d">section</text>
  <text x="240" y="444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">의미 단위 영역 — 소개·작품 등</text>

  <rect x="60" y="474" width="640" height="58" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="84" y="510" font-family="'Courier New',monospace" font-size="18" font-weight="700" fill="#374151">article</text>
  <text x="240" y="510" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">떼어내도 말이 되는 글 한 덩어리</text>

  <rect x="60" y="540" width="640" height="58" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="84" y="576" font-family="'Courier New',monospace" font-size="18" font-weight="700" fill="#92400e">footer</text>
  <text x="240" y="576" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">페이지 하단 — 저작권·연락처 자리</text>

  <!-- 우측: 와이어프레임 영역 색칠 -->
  <text x="740" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">한 페이지에서 보면</text>

  <rect x="740" y="276" width="480" height="322" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- header -->
  <rect x="760" y="294" width="440" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="980" y="322" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" font-weight="700" fill="#1e40af">header</text>
  <!-- main wrapper -->
  <rect x="760" y="348" width="440" height="190" rx="8" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="772" y="368" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#9ca3af">main</text>
  <rect x="774" y="378" width="412" height="68" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="980" y="408" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#15803d">section</text>
  <text x="980" y="430" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#166534">소개 영역</text>
  <rect x="774" y="456" width="412" height="70" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="980" y="486" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#15803d">section &gt; article</text>
  <text x="980" y="508" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#166534">작품 영역</text>
  <!-- footer -->
  <rect x="760" y="548" width="440" height="36" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="980" y="571" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" font-weight="700" fill="#92400e">footer</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">외우지 마세요 — "이 영역은 footer로 빼줘" 정도만 말할 수 있으면 됩니다</text>
</svg>
