<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 02</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">오늘 가져갈 결과물</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">2시간 후 내 손에 무엇이 남는지 — 단계별로 쌓입니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">한 페이지가 단계마다 자랍니다</text>

  <!-- 3단계 와이어프레임 진행도 -->
  <!-- 1단계: 텅 빈 뼈대 -->
  <rect x="60" y="280" width="320" height="170" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="84" y="312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#d97706" letter-spacing="0.05em">1단계</text>
  <rect x="84" y="328" width="272" height="14" rx="3" fill="#fcd34d"/>
  <rect x="84" y="352" width="180" height="10" rx="3" fill="#fde68a"/>
  <rect x="84" y="372" width="220" height="10" rx="3" fill="#fde68a"/>
  <rect x="84" y="398" width="96" height="20" rx="6" fill="#fcd34d"/>
  <text x="220" y="438" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#92400e">이름·소개·연락 버튼 뼈대</text>

  <text x="400" y="372" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" fill="#9ca3af">→</text>

  <!-- 2단계: 섹션 추가 -->
  <rect x="420" y="280" width="320" height="170" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="444" y="312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.05em">2단계</text>
  <rect x="444" y="328" width="272" height="22" rx="4" fill="#bfdbfe"/>
  <rect x="444" y="356" width="272" height="22" rx="4" fill="#bfdbfe"/>
  <rect x="444" y="384" width="272" height="22" rx="4" fill="#bfdbfe"/>
  <text x="580" y="438" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#1e40af">작품·연락처 섹션 추가</text>

  <text x="760" y="372" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" fill="#9ca3af">→</text>

  <!-- 3단계: 이미지·링크 -->
  <rect x="780" y="280" width="320" height="170" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="804" y="312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#16a34a" letter-spacing="0.05em">3단계</text>
  <rect x="804" y="328" width="128" height="50" rx="6" fill="#bbf7d0"/>
  <rect x="948" y="328" width="128" height="50" rx="6" fill="#bbf7d0"/>
  <rect x="804" y="386" width="128" height="20" rx="5" fill="#86efac"/>
  <rect x="948" y="386" width="128" height="20" rx="5" fill="#86efac"/>
  <text x="940" y="438" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#15803d">이미지·외부 링크 연결</text>

  <!-- 우측 능력 + 연결 박스 -->
  <rect x="60" y="478" width="700" height="118" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="84" y="516" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#374151">핵심 능력 — Claude에게 "구조만" 지시하는 프롬프트 감각</text>
  <text x="84" y="548" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">못생긴 검은 글씨 페이지가 정상입니다 — 옷 안 입은 사람 골격 같은 것</text>
  <text x="84" y="574" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">구체 항목만 또렷하게 말하면 Claude가 알아서 배치합니다</text>

  <rect x="780" y="478" width="440" height="118" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="804" y="516" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#1e40af" letter-spacing="0.05em">다음 회차 연결</text>
  <text x="804" y="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#1e40af">이 뼈대 위에</text>
  <text x="804" y="576" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#1e40af">다음 주 CSS로 옷 입히기</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">텅 빈 페이지 하나가 오늘 안에 세 번 자랍니다</text>
</svg>
