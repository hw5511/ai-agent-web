<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 02</text>
  <rect x="144" y="44" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d1d5db" stroke-width="1"/>
  <text x="170" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.05em">실습 3</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 ③ — 링크와 이미지</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">a 태그·img 태그로 외부 자원을 페이지에 연결합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Claude 지시문 박스 -->
  <rect x="60" y="240" width="700" height="100" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="84" y="258" width="104" height="22" rx="11" fill="#2563eb"/>
  <text x="136" y="273" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Claude 지시문</text>
  <text x="84" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#1e40af">"작품 갤러리에 임시 이미지(loremflickr) 4개 넣고</text>
  <text x="84" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#1e40af">각각 외부 사이트로 가는 링크를 달아줘."</text>

  <!-- 좌측 설명 박스 2개 -->
  <rect x="60" y="356" width="340" height="80" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="84" y="392" font-family="'Courier New',monospace" font-size="17" font-weight="700" fill="#15803d">a 태그</text>
  <text x="84" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">클릭하면 다른 곳으로 가는 링크</text>

  <rect x="420" y="356" width="340" height="80" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="444" y="392" font-family="'Courier New',monospace" font-size="17" font-weight="700" fill="#92400e">img 태그</text>
  <text x="444" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#78350f">화면에 그림을 띄우는 이미지</text>

  <!-- 주소 패턴 코드 박스 -->
  <rect x="60" y="448" width="700" height="80" rx="12" fill="#0f172a"/>
  <text x="84" y="478" font-family="'Courier New',monospace" font-size="14" fill="#6b7280">// 키워드 기반 임시 이미지 주소 URL</text>
  <text x="84" y="508" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">loremflickr.com/600/400/food</text>

  <!-- 우측 결과 목업: 이미지 4개 -->
  <text x="780" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">결과 — 이미지 4개 + 클릭 이동</text>
  <rect x="780" y="276" width="440" height="252" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="804" y="300" width="190" height="92" rx="8" fill="#dbeafe"/>
  <text x="899" y="352" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#1e40af">food</text>
  <rect x="1006" y="300" width="190" height="92" rx="8" fill="#dcfce7"/>
  <text x="1101" y="352" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#15803d">travel</text>
  <rect x="804" y="404" width="190" height="92" rx="8" fill="#fef3c7"/>
  <text x="899" y="456" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#92400e">design</text>
  <rect x="1006" y="404" width="190" height="92" rx="8" fill="#fce7f3"/>
  <text x="1101" y="456" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#be185d">code</text>
  <text x="1000" y="518" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">이미지를 누르면 외부 사이트로 이동</text>

  <!-- 팁 박스 -->
  <rect x="60" y="544" width="700" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="84" y="576" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">팁 — 키워드(food·travel·design)를 바꿔보며 마음에 드는 이미지 찾기</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">이제 페이지에 색이 좀 생겼지요 — 다음 주에 CSS로 본격 디자인 들어갑니다</text>
</svg>
