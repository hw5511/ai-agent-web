  <text x="84" y="578" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">• 끝에 -dev · -studio 붙이기   • 본인 영문 이름 + 직업/취미 조합   • 더 싼 끝부분(.shop · .kr)으로 바꿔보기</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">결제 완료 = 이제 이 이름은 내 것 — 1년간 나만의 도메인입니다</text>
