<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 13</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">오늘은 내 도메인을 가집니다</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">심화 트랙 Part 2 · 오늘의 1개념 — 내 도메인 가지기</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">오늘 끝나면 주소가 이렇게 바뀝니다</text>

  <!-- Before 카드 (회색) -->
  <rect x="60" y="284" width="500" height="124" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="310" y="324" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#9ca3af" letter-spacing="0.04em">지금 (8주차에 만든 주소)</text>
  <text x="310" y="364" text-anchor="middle" font-family="'Courier New',monospace" font-size="21" font-weight="700" fill="#6b7280">hw5511.github.io/portfolio</text>
  <text x="310" y="392" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#9ca3af">길고, 남의 이름이 들어간 주소</text>

  <text x="610" y="356" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="34" fill="#9ca3af">→</text>

  <!-- After 카드 (파랑 = 도메인) -->
  <rect x="660" y="284" width="500" height="124" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="910" y="324" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#2563eb" letter-spacing="0.04em">오늘 끝 (진짜 내 이름의 주소)</text>
  <text x="910" y="364" text-anchor="middle" font-family="'Courier New',monospace" font-size="23" font-weight="700" fill="#1e40af">내이름.com</text>
  <text x="910" y="392" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#1d4ed8">짧고, 친구에게 자신 있게 보낼 수 있는 주소</text>

  <text x="60" y="456" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">2시간 안에 거치는 길</text>

  <!-- 흐름 칩 -->
  <rect x="60" y="478" width="240" height="48" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="180" y="508" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#92400e">① 구매</text>
  <text x="318" y="508" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" fill="#9ca3af">→</text>
  <rect x="336" y="478" width="240" height="48" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="456" y="508" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#15803d">② 연결</text>
  <text x="594" y="508" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" fill="#9ca3af">→</text>
  <rect x="612" y="478" width="240" height="48" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="732" y="508" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#1e40af">③ 자물쇠 켜기</text>

  <!-- 자물쇠 SVG path + https 강조 (우측) -->
  <g transform="translate(900,478)">
    <rect x="6" y="22" width="40" height="26" rx="5" fill="#15803d"/>
    <path d="M14 22 v-7 a12 12 0 0 1 24 0 v7" fill="none" stroke="#15803d" stroke-width="5"/>
    <rect x="23" y="31" width="6" height="9" rx="3" fill="#ffffff"/>
  </g>
  <text x="958" y="508" font-family="'Courier New',monospace" font-size="17" font-weight="700" fill="#15803d">https://</text>
  <text x="1058" y="508" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">안전한 주소</text>

  <!-- 안내 박스 -->
  <rect x="60" y="546" width="1160" height="50" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="90" y="577" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#6d28d9">미리 안내 — 오늘은 도메인 구매가 있어요. 1년에 1~2만원, 더 싼 끝부분(.kr · .shop)도 OK</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">오늘의 wow 모먼트 — 친구에게 보낼 수 있는, 진짜 내 이름의 주소</text>
</svg>
