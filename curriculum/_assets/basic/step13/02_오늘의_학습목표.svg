<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 13</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">오늘의 학습 목표</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">코드 한 줄도 안 씁니다 — 클릭과 입력만으로 4단계를 거칩니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">2시간 안에 도달할 4단계</text>

  <!-- 4단계 체크리스트 (좌측 세로 스택) -->
  <!-- 1 이해 -->
  <rect x="60" y="278" width="700" height="68" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <circle cx="100" cy="312" r="18" fill="#fef3c7"/>
  <text x="100" y="318" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="900" fill="#92400e">1</text>
  <text x="138" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#374151">이해 — 도메인이 뭔지 안다</text>
  <text x="138" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">"내 가게 간판" 비유로 한 번에 이해</text>

  <!-- 2 구매 -->
  <rect x="60" y="358" width="700" height="68" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <circle cx="100" cy="392" r="18" fill="#fef3c7"/>
  <text x="100" y="398" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="900" fill="#92400e">2</text>
  <text x="138" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#374151">구매 — 가비아에서 내 이름 도메인을 산다</text>
  <text x="138" y="410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">검색 → 선택 → 결제 (1~2만원, 1년치)</text>

  <!-- 3 연결 -->
  <rect x="60" y="438" width="700" height="68" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <circle cx="100" cy="472" r="18" fill="#dcfce7"/>
  <text x="100" y="478" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="900" fill="#15803d">3</text>
  <text x="138" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#374151">연결 — 내 도메인을 8주차 사이트에 붙인다</text>
  <text x="138" y="490" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">주소 정보(DNS) 몇 줄을 입력해서 연결</text>

  <!-- 4 SSL -->
  <rect x="60" y="518" width="700" height="68" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <circle cx="100" cy="552" r="18" fill="#dbeafe"/>
  <text x="100" y="558" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="900" fill="#1e40af">4</text>
  <text x="138" y="546" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#374151">자물쇠 — https:// 켜고 친구에게 공유</text>
  <text x="138" y="570" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">안전한 주소가 되면 끝</text>

  <!-- 우측 최종 결과물 미리보기 -->
  <text x="800" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">최종 결과물 미리보기</text>
  <rect x="800" y="278" width="420" height="200" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- 브라우저 주소창 -->
  <rect x="800" y="278" width="420" height="44" rx="14" fill="#f3f4f6"/>
  <rect x="800" y="300" width="420" height="22" fill="#f3f4f6"/>
  <g transform="translate(820,290)">
    <rect x="0" y="6" width="14" height="9" rx="2" fill="#15803d"/>
    <path d="M3 6 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke="#15803d" stroke-width="2"/>
  </g>
  <text x="844" y="306" font-family="'Courier New',monospace" font-size="15" font-weight="700" fill="#15803d">https://내이름.com</text>
  <text x="1010" y="372" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#374151">내 포트폴리오</text>
  <line x1="850" y1="392" x2="1170" y2="392" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="850" y="408" width="150" height="50" rx="8" fill="#dbeafe"/>
  <rect x="1020" y="408" width="150" height="50" rx="8" fill="#fef3c7"/>
  <rect x="800" y="500" width="420" height="86" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="824" y="534" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#6d28d9">부담스러우면?</text>
  <text x="824" y="562" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#7c3aed">.com 대신 .kr · .shop 등 더 싼 끝부분도 좋아요</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">끝나면 — "이거 내 도메인이야"라고 말할 수 있는 상태</text>
</svg>
