<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 13</text>
  <rect x="144" y="44" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d1d5db" stroke-width="1"/>
  <text x="170" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.05em">실습 3</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 ③ + 정리 — 자물쇠 켜고 공유</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">https:// 자물쇠를 켜고, 완성된 내 도메인을 동료에게 공유합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Claude 지시문 박스 -->
  <rect x="60" y="232" width="1160" height="64" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="84" y="246" width="104" height="22" rx="11" fill="#2563eb"/>
  <text x="136" y="261" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Claude 지시문</text>
  <text x="200" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#1e40af">"GitHub Pages에서 내 도메인에 SSL을 적용하고 싶어."</text>
  <text x="84" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#1e40af">"Settings에서 어디를 체크해야 하는지 안내해줘."</text>

  <!-- 좌측: 자물쇠 OFF vs ON 비교 -->
  <text x="60" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">Enforce HTTPS 체크하면</text>
  <!-- OFF (회색/빨강 경고) -->
  <rect x="60" y="346" width="270" height="140" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <g transform="translate(160,372)">
    <rect x="0" y="22" width="48" height="30" rx="5" fill="#b91c1c"/>
    <path d="M9 22 v-7 a15 15 0 0 1 30 0" fill="none" stroke="#b91c1c" stroke-width="5"/>
    <rect x="20" y="31" width="8" height="12" rx="4" fill="#ffffff"/>
  </g>
  <text x="195" y="452" text-anchor="middle" font-family="'Courier New',monospace" font-size="17" font-weight="700" fill="#b91c1c">http://</text>
  <text x="195" y="476" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#991b1b">자물쇠 열림 · 경고 뜸</text>

  <text x="345" y="424" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" fill="#9ca3af">→</text>

  <!-- ON (초록) -->
  <rect x="360" y="346" width="270" height="140" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <g transform="translate(460,372)">
    <rect x="0" y="22" width="48" height="30" rx="5" fill="#15803d"/>
    <path d="M9 22 v-7 a15 15 0 0 1 30 0 v7" fill="none" stroke="#15803d" stroke-width="5"/>
    <rect x="20" y="31" width="8" height="12" rx="4" fill="#ffffff"/>
  </g>
  <text x="495" y="452" text-anchor="middle" font-family="'Courier New',monospace" font-size="17" font-weight="700" fill="#15803d">https://</text>
  <text x="495" y="476" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#166534">자물쇠 잠김 · 안전</text>

  <!-- 동작/주의 안내 -->
  <rect x="60" y="498" width="570" height="92" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="84" y="528" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">• 안에서는 Let's Encrypt가 인증서를 자동 발급</text>
  <text x="84" y="552" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">• 체크박스가 회색이면 아직 주소 정보 퍼지는 중</text>
  <text x="84" y="576" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#b91c1c">→ 5~30분 후 다시 시도하면 켜집니다 (기다림이 정답)</text>

  <!-- 우측: 회고 2열 -->
  <text x="660" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">오늘 회고</text>
  <rect x="660" y="346" width="278" height="244" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="684" y="382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#1e40af">오늘 가진 것</text>
  <line x1="684" y1="398" x2="914" y2="398" stroke="#93c5fd" stroke-width="1"/>
  <text x="684" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#1d4ed8">• 내 이름의 도메인</text>
  <text x="684" y="462" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#1d4ed8">• 8주차 사이트에 연결</text>
  <text x="684" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#1d4ed8">• https:// 안전한 주소</text>
  <text x="684" y="540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2563eb">"나는 이제 .com을</text>
  <text x="684" y="564" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2563eb">가진 사람"</text>

  <rect x="948" y="346" width="272" height="244" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="972" y="382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#15803d">다음 주 (14회차)</text>
  <line x1="972" y1="398" x2="1196" y2="398" stroke="#86efac" stroke-width="1"/>
  <text x="972" y="436" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#166534">Vercel</text>
  <text x="972" y="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#15803d">더 빠르고 자동화된</text>
  <text x="972" y="490" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#15803d">사이트 올리기 옵션</text>
  <text x="972" y="540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#15803d">먼저 친구 단톡에</text>
  <text x="972" y="564" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#15803d">내 도메인 링크 공유하기</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">자물쇠가 켜지면 박수 — 오늘 우리는 진짜 내 주소를 가졌습니다</text>
</svg>
