  <text x="120" y="516" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="500" fill="#171717">GitHub Pages에 연결하고 https 자물쇠 켜기</text>
