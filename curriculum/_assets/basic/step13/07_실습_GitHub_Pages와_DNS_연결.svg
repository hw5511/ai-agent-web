<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 13</text>
  <rect x="144" y="44" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d1d5db" stroke-width="1"/>
  <text x="170" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.05em">실습 2</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 ② — 내 사이트에 도메인 연결</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">가비아에 주소 정보(A·CNAME) 입력 + GitHub에 도메인 적기</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Claude 지시문 박스 -->
  <rect x="60" y="234" width="1160" height="86" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="84" y="250" width="104" height="22" rx="11" fill="#2563eb"/>
  <text x="136" y="265" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Claude 지시문</text>
  <text x="84" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#1e40af">"GitHub Pages 도메인 연결 방법 알려줘. 가비아에 A 레코드 4개 입력하고, 레포 Settings에 도메인 입력하는 순서대로."</text>

  <!-- 좌측: 가비아 DNS 입력표 -->
  <text x="60" y="350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#15803d" letter-spacing="0.08em">① 가비아 → My가비아 → DNS 관리</text>
  <rect x="60" y="364" width="560" height="222" rx="12" fill="#0f172a"/>
  <text x="84" y="396" font-family="'Courier New',monospace" font-size="13" fill="#6b7280">// 그대로 복사 — 호스트 / 값</text>
  <text x="84" y="424" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">A   @   185.199.108.153</text>
  <text x="84" y="448" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">A   @   185.199.109.153</text>
  <text x="84" y="472" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">A   @   185.199.110.153</text>
  <text x="84" y="496" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">A   @   185.199.111.153</text>
  <text x="84" y="524" font-family="'Courier New',monospace" font-size="15" fill="#38bdf8">CNAME  www  hw5511.github.io</text>
  <text x="84" y="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#94a3b8">@ = 내도메인.com (루트)  ·  www = www.내도메인.com</text>

  <!-- 우측: GitHub Settings 화면 -->
  <text x="660" y="350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#1e40af" letter-spacing="0.08em">② GitHub 레포 → Settings → Pages</text>
  <rect x="660" y="364" width="560" height="222" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="684" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">Custom domain</text>
  <rect x="684" y="412" width="400" height="40" rx="8" fill="#f9fafb" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="700" y="438" font-family="'Courier New',monospace" font-size="16" font-weight="700" fill="#1e40af">내도메인.com</text>
  <rect x="1096" y="412" width="100" height="40" rx="8" fill="#dbeafe"/>
  <text x="1146" y="438" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1e40af">Save</text>
  <line x1="684" y1="474" x2="1196" y2="474" stroke="#f3f4f6" stroke-width="1"/>
  <text x="684" y="504" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">• 레포에 CNAME 파일이 자동 생성됨 (확인만)</text>
  <rect x="684" y="520" width="512" height="48" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="704" y="549" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6d28d9">"DNS check in progress" 메시지는 정상 — 기다리면 됩니다</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">입력값은 복사만 하면 됩니다 — 헷갈리는 건 클로드에게 다시 물어보세요</text>
</svg>
