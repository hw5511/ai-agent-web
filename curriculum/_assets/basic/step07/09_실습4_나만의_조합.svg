<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 07</text>
  <rect x="144" y="44" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d1d5db" stroke-width="1"/>
  <text x="170" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.05em">실습 4</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 ④ — 나만의 5종 조합 풀 스펙 랜딩</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">내 페이지 분위기에 맞춰 1~2개를 골라 완성합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Claude 지시문 박스 -->
  <rect x="60" y="240" width="1160" height="80" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="84" y="256" width="104" height="22" rx="11" fill="#2563eb"/>
  <text x="136" y="271" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Claude 지시문</text>
  <text x="84" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#1e40af">"지금까지 만든 페이지를 풀 스펙 랜딩으로 정리해줘. 파티클 배경 + 타이핑 직함 + 스크롤 효과."</text>

  <text x="60" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">분위기 → 추천 조합</text>

  <!-- 4종 분위기 매트릭스 -->
  <rect x="60" y="382" width="278" height="160" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="84" y="418" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#1e40af">차분형</text>
  <line x1="84" y1="432" x2="314" y2="432" stroke="#93c5fd" stroke-width="1"/>
  <text x="84" y="462" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#1e3a8a">파티클 + 타이핑</text>
  <text x="84" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#1e3a8a">잔잔하게 살아 움직임</text>
  <text x="84" y="522" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#2563eb">기본 추천 조합</text>

  <rect x="354" y="382" width="278" height="160" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="378" y="418" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#92400e">역동형</text>
  <line x1="378" y1="432" x2="608" y2="432" stroke="#fcd34d" stroke-width="1"/>
  <text x="378" y="462" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#78350f">VANTA + 파티클</text>
  <text x="378" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#78350f">화면 가득 움직임</text>
  <text x="378" y="522" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#d97706">화려한 인상</text>

  <rect x="648" y="382" width="278" height="160" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="672" y="418" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#15803d">미니멀형</text>
  <line x1="672" y1="432" x2="902" y2="432" stroke="#86efac" stroke-width="1"/>
  <text x="672" y="462" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">Canvas 별자리</text>
  <text x="672" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">한 가지 효과만 깔끔하게</text>
  <text x="672" y="522" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#16a34a">절제된 분위기</text>

  <rect x="942" y="382" width="278" height="160" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="966" y="418" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#6d28d9">입체형</text>
  <line x1="966" y1="432" x2="1196" y2="432" stroke="#d8b4fe" stroke-width="1"/>
  <text x="966" y="462" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6d28d9">Three.js 큐브 + 타이핑</text>
  <text x="966" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6d28d9">3D 포인트 강조</text>
  <text x="966" y="522" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7c3aed">기술적 인상</text>

  <!-- 경고 박스 -->
  <rect x="60" y="556" width="1160" height="44" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="84" y="584" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#991b1b">주의 — 같은 화면에 효과 3개 이상 동시 적용은 산만합니다. 2개까지만 권장.</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">고민되면 차분형(파티클 + 타이핑)부터 — 시간이 남으면 하나 더 얹으세요</text>
</svg>
