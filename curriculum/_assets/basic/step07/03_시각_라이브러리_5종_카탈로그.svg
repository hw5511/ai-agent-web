<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 07</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">시각 라이브러리 5종 카탈로그</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">어떤 효과 = 어떤 도구 — 이 매칭만 외우면 됩니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">5종 한눈에</text>

  <!-- 5칸 카드 (너비 216, 간격 20) -->
  <!-- 1 tsParticles -->
  <rect x="60" y="280" width="216" height="280" rx="16" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <text x="168" y="328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#92400e">tsParticles</text>
  <line x1="84" y1="346" x2="252" y2="346" stroke="#fcd34d" stroke-width="1"/>
  <text x="168" y="386" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#78350f">점·선으로 이루어진</text>
  <text x="168" y="408" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#78350f">파티클 배경 효과</text>
  <text x="168" y="430" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#78350f">전문 도구</text>
  <rect x="118" y="510" width="100" height="28" rx="8" fill="#fcd34d"/>
  <text x="168" y="529" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#78350f">배경</text>

  <!-- 2 Typed.js -->
  <rect x="296" y="280" width="216" height="280" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="404" y="328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#1e40af">Typed.js</text>
  <line x1="320" y1="346" x2="488" y2="346" stroke="#93c5fd" stroke-width="1"/>
  <text x="404" y="386" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#1e3a8a">텍스트가 저절로</text>
  <text x="404" y="408" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#1e3a8a">타이핑·삭제 반복</text>
  <text x="404" y="430" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#1e3a8a">직함·슬로건용</text>
  <rect x="354" y="510" width="100" height="28" rx="8" fill="#93c5fd"/>
  <text x="404" y="529" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">텍스트</text>

  <!-- 3 Three.js -->
  <rect x="532" y="280" width="216" height="280" rx="16" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  <text x="640" y="328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#6d28d9">Three.js</text>
  <line x1="556" y1="346" x2="724" y2="346" stroke="#d8b4fe" stroke-width="1"/>
  <text x="640" y="386" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6d28d9">진짜 3D 입체</text>
  <text x="640" y="408" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6d28d9">큐브·구체·모델을</text>
  <text x="640" y="430" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6d28d9">화면에 띄움</text>
  <rect x="590" y="510" width="100" height="28" rx="8" fill="#d8b4fe"/>
  <text x="640" y="529" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#6d28d9">3D</text>

  <!-- 4 VANTA -->
  <rect x="768" y="280" width="216" height="280" rx="16" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <text x="876" y="328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#92400e">VANTA</text>
  <line x1="792" y1="346" x2="960" y2="346" stroke="#fcd34d" stroke-width="1"/>
  <text x="876" y="386" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#78350f">화면 가득 채우는</text>
  <text x="876" y="408" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#78350f">움직이는 배경</text>
  <text x="876" y="430" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#78350f">구름·물결·새 떼</text>
  <rect x="826" y="510" width="100" height="28" rx="8" fill="#fcd34d"/>
  <text x="876" y="529" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#78350f">배경</text>

  <!-- 5 Canvas 2D -->
  <rect x="1004" y="280" width="216" height="280" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="1112" y="328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#15803d">Canvas 2D</text>
  <line x1="1028" y1="346" x2="1196" y2="346" stroke="#86efac" stroke-width="1"/>
  <text x="1112" y="386" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">브라우저 기본</text>
  <text x="1112" y="408" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">그리기 도구</text>
  <text x="1112" y="430" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">원 + 선 = 모든 효과</text>
  <rect x="1062" y="510" width="100" height="28" rx="8" fill="#86efac"/>
  <text x="1112" y="529" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#166534">직접 그리기</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">코드는 클로드가 씁니다 — 우리는 효과 이름만 짚어주면 됩니다</text>
</svg>
