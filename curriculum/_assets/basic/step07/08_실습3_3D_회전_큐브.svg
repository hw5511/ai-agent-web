<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 07</text>
  <rect x="144" y="44" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d1d5db" stroke-width="1"/>
  <text x="170" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.05em">실습 3</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 ③ — Three.js로 3D 회전 큐브</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">3종 세트가 있다는 것만 인지하면 됩니다 — 코드는 클로드 담당</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Claude 지시문 박스 -->
  <rect x="60" y="240" width="1160" height="80" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="84" y="256" width="104" height="22" rx="11" fill="#2563eb"/>
  <text x="136" y="271" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Claude 지시문</text>
  <text x="84" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#1e40af">"히어로 오른쪽에 Three.js로 네온 파란 와이어프레임 큐브가 천천히 회전하도록."</text>

  <!-- 좌측: 3종 세트 다이어그램 -->
  <text x="60" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">Three.js 3종 세트</text>

  <rect x="60" y="382" width="560" height="58" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="84" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#6d28d9">Scene</text>
  <text x="200" y="418" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6d28d9">무대 — 물체가 놓이는 공간</text>

  <text x="340" y="462" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" fill="#9ca3af">↓</text>

  <rect x="60" y="470" width="560" height="58" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="84" y="496" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#6d28d9">Camera</text>
  <text x="200" y="506" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6d28d9">시점 — 어디서 바라볼지</text>

  <text x="340" y="550" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" fill="#9ca3af">↓</text>

  <rect x="60" y="538" width="560" height="58" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="84" y="564" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#6d28d9">Renderer</text>
  <text x="200" y="574" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6d28d9">화면 — 결과를 그려서 보여줌</text>

  <!-- 우측: 큐브 미리보기 (다크) -->
  <text x="660" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">미리보기 — 네온 파란 와이어프레임</text>
  <rect x="660" y="382" width="560" height="214" rx="12" fill="#0f172a"/>
  <!-- 와이어프레임 큐브 (앞면 + 뒷면 + 연결선) -->
  <rect x="855" y="430" width="120" height="120" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <rect x="905" y="408" width="120" height="120" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <line x1="855" y1="430" x2="905" y2="408" stroke="#38bdf8" stroke-width="2"/>
  <line x1="975" y1="430" x2="1025" y2="408" stroke="#38bdf8" stroke-width="2"/>
  <line x1="855" y1="550" x2="905" y2="528" stroke="#38bdf8" stroke-width="2"/>
  <line x1="975" y1="550" x2="1025" y2="528" stroke="#38bdf8" stroke-width="2"/>
  <text x="940" y="586" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#a3e635">BoxGeometry + 천천히 회전</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">3D 모델 파일이 없어도 큐브 하나면 충분합니다</text>
</svg>
