  <text x="120" y="316" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="500" fill="#171717">시각 라이브러리 5종 : tsParticles · Typed · Three · VANTA · Canvas</text>

