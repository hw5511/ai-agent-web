  <text x="120" y="364" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="500" fill="#171717">CDN 한 줄 + 자연어 지시로 누구나 효과를 붙인다</text>

