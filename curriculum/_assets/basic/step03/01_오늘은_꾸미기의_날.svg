<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 03</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">Session 3 — CSS, 디자인 (색·폰트·여백)</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">같은 뼈대, 전혀 다른 옷 — HTML은 그대로 두고 CSS만 얹습니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">오늘의 미션 — 같은 페이지, 옷만 갈아입히기</text>

  <!-- Before 썸네일 (기본 흰 페이지) -->
  <rect x="60" y="290" width="480" height="240" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="84" y="316" width="180" height="20" rx="5" fill="#d1d5db"/>
  <rect x="84" y="350" width="432" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="84" y="370" width="432" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="84" y="390" width="320" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="84" y="430" width="120" height="34" rx="6" fill="#e5e7eb"/>
  <text x="300" y="510" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#9ca3af">2주차 — 기본 HTML 페이지</text>

  <!-- 가운데 화살표 + CSS -->
  <text x="640" y="405" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="44" fill="#9ca3af">→</text>
  <rect x="606" y="424" width="68" height="30" rx="8" fill="#2563eb"/>
  <text x="640" y="445" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.05em">CSS</text>

  <!-- After 썸네일 (다크 테크) -->
  <rect x="740" y="290" width="480" height="240" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="764" y="316" width="180" height="20" rx="5" fill="#38bdf8"/>
  <rect x="764" y="350" width="432" height="10" rx="5" fill="#334155"/>
  <rect x="764" y="370" width="432" height="10" rx="5" fill="#334155"/>
  <rect x="764" y="390" width="320" height="10" rx="5" fill="#334155"/>
  <rect x="764" y="430" width="120" height="34" rx="6" fill="#38bdf8"/>
  <text x="980" y="510" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#38bdf8">3주차 — 다크 테크로 리디자인</text>

  <!-- 진행 점 8개 (첫 점 강조) -->
  <circle cx="586" cy="566" r="6" fill="#171717"/>
  <circle cx="610" cy="566" r="6" fill="#e5e7eb"/>
  <circle cx="634" cy="566" r="6" fill="#e5e7eb"/>
  <circle cx="658" cy="566" r="6" fill="#e5e7eb"/>
  <circle cx="682" cy="566" r="6" fill="#e5e7eb"/>
  <circle cx="706" cy="566" r="6" fill="#e5e7eb"/>
  <circle cx="730" cy="566" r="6" fill="#e5e7eb"/>
  <circle cx="754" cy="566" r="6" fill="#e5e7eb"/>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">HTML 다시 짜는 거 아닙니다 — 지난주 뼈대 그대로, 옷만 갈아입힙니다</text>
</svg>
