<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 03</text>
  <rect x="144" y="44" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d1d5db" stroke-width="1"/>
  <text x="170" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.05em">실습 2</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 ② — Google Fonts로 갈아끼우기</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">link 한 줄로 한글+영문 폰트가 동시에 바뀌는 경험</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Claude 지시문 박스 -->
  <rect x="60" y="240" width="1160" height="78" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="84" y="258" width="104" height="22" rx="11" fill="#2563eb"/>
  <text x="136" y="273" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">클로드 지시문</text>
  <text x="84" y="305" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#1e40af">"위 페이지에 Google Fonts의 Noto Sans KR(한글) + Inter(영문) 폰트 적용해줘."</text>

  <!-- 좌: 클로드가 자동으로 하는 일 -->
  <text x="60" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">클로드가 자동으로 하는 일</text>
  <rect x="60" y="378" width="565" height="150" rx="14" fill="#0f172a"/>
  <text x="84" y="412" font-family="'Courier New',monospace" font-size="14" fill="#6b7280">// head에 폰트 link 2개 추가</text>
  <text x="84" y="440" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">&lt;link href="...Noto+Sans+KR"&gt;</text>
  <text x="84" y="468" font-family="'Courier New',monospace" font-size="14" fill="#6b7280">// body에 폰트 지정</text>
  <text x="84" y="496" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">font-family: 'Inter',</text>
  <text x="84" y="518" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">  'Noto Sans KR', sans-serif;</text>

  <!-- 우: 적용 전/후 비교 -->
  <text x="655" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">적용 전 → 적용 후</text>
  <rect x="655" y="378" width="565" height="68" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="679" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">적용 전 — 기본 시스템 폰트</text>
  <text x="679" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="400" fill="#9ca3af">Welcome 환영합니다</text>
  <rect x="655" y="458" width="565" height="70" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="679" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#2563eb">적용 후 — Inter + Noto Sans KR</text>
  <text x="679" y="514" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Welcome 환영합니다</text>

  <!-- 확인해보세요 박스 -->
  <rect x="60" y="540" width="1160" height="60" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="84" y="556" width="104" height="22" rx="11" fill="#16a34a"/>
  <text x="136" y="571" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">확인해보세요</text>
  <text x="204" y="576" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">• 한글 폰트가 바뀌었다  • 영문 폰트가 바뀌었다  • 한글이 깨지면 "한글 폰트 다시 적용해줘"</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">영문을 앞에 두면 영문은 Inter, 한글은 자동으로 Noto Sans KR로 떨어집니다</text>
</svg>
