  <text x="60" y="582" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#374151">Before · 흰 배경 + 시스템 폰트 + 빡빡한 여백</text>
