<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 01</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">오늘의 학습 목표</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">2시간 끝에 손에 쥐는 3가지 결과물</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">오늘 가져갈 것</text>

  <!-- 결과물 1 (노랑) -->
  <rect x="60" y="278" width="360" height="240" rx="16" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <rect x="84" y="302" width="26" height="26" rx="6" fill="#d97706"/>
  <path d="M90 315 l5 5 l9 -11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="124" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#92400e">결과물 1</text>
  <line x1="84" y1="344" x2="396" y2="344" stroke="#fcd34d" stroke-width="1"/>
  <text x="84" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#78350f">내가 만든 페이지</text>
  <text x="84" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#92400e">Claude Design으로 직접 만든</text>
  <text x="84" y="454" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#92400e">나만의 웹 페이지 1개</text>
  <text x="84" y="498" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#d97706">손에 잡히는 첫 결과물</text>

  <!-- 결과물 2 (파랑) -->
  <rect x="460" y="278" width="360" height="240" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <rect x="484" y="302" width="26" height="26" rx="6" fill="#2563eb"/>
  <path d="M490 315 l5 5 l9 -11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="524" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">결과물 2</text>
  <line x1="484" y1="344" x2="796" y2="344" stroke="#93c5fd" stroke-width="1"/>
  <text x="484" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">16주 청사진</text>
  <text x="484" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e40af">16주 후 내 모습을 그리는</text>
  <text x="484" y="454" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e40af">머릿속 지도</text>
  <text x="484" y="498" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#2563eb">어디로 가는지 알게 됨</text>

  <!-- 결과물 3 (초록) -->
  <rect x="860" y="278" width="360" height="240" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <rect x="884" y="302" width="26" height="26" rx="6" fill="#16a34a"/>
  <path d="M890 315 l5 5 l9 -11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="924" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#15803d">결과물 3</text>
  <line x1="884" y1="344" x2="1196" y2="344" stroke="#86efac" stroke-width="1"/>
  <text x="884" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#166534">첫 안녕하세요 페이지</text>
  <text x="884" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#15803d">Claude Code로 직접 띄운</text>
  <text x="884" y="454" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#15803d">코드로 만든 첫 페이지</text>
  <text x="884" y="498" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#16a34a">진짜 시작점</text>

  <!-- 마무리 한 줄 -->
  <rect x="60" y="540" width="1160" height="56" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="640" y="575" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#374151">오늘 끝나면 — "나도 만들 수 있구나" + "근데 더 알고 싶다"</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">코딩 한 줄 안 써봤어도 오늘 끝엔 본인 페이지가 손에 들려있습니다</text>
</svg>
