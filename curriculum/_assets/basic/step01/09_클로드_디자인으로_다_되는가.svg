<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs><style>@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css");</style></defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- WEB 01 배지 -->
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 01</text>

  <!-- 제목 (질문) -->
  <text x="60" y="132" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717" letter-spacing="-0.01em">"클로드 디자인으로 다 되는 거 아닌가요?"</text>

  <!-- 부제 -->
  <text x="60" y="180" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#6b7280">새로운 충격 — 만들기의 문턱이 사라졌다</text>

  <!-- 구분선 -->
  <line x1="60" y1="214" x2="1220" y2="214" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 본문 -->
  <text x="80" y="296" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#374151">발표자료 · 시각자료 · 간단한 랜딩페이지</text>
  <text x="80" y="352" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="32" font-weight="700" fill="#171717">이제는 '초등학생'도 만든다</text>

  <text x="80" y="446" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="400" fill="#6b7280">누구나 하루 만에 만드는 결과물이</text>
  <text x="80" y="486" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="400" fill="#6b7280">어떤 경쟁력을 가질까?</text>

  <!-- 짧은 구분선 -->
  <rect x="80" y="524" width="80" height="3" rx="1.5" fill="#e5e7eb"/>

  <!-- 그린 강조 한 줄 -->
  <text x="80" y="584" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="32" font-weight="700" fill="#16a34a">진짜 웹은 '다음 페이지'부터</text>
  <text x="80" y="624" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="400" fill="#6b7280">그 다음 페이지를 16주 동안 배운다</text>
</svg>
