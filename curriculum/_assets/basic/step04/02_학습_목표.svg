<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 04</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">학습 목표 — 2시간 뒤 도달할 모습</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">'암기'가 아니라 '경험' — 끝나면 친구에게 내 사이트를 자랑할 수 있습니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">오늘 얻는 4가지</text>

  <!-- 4 체크리스트 카드 (2x2) -->
  <rect x="60" y="278" width="565" height="110" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <path d="M86 322 l8 8 l16 -18" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="122" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#92400e">개념 이해</text>
  <text x="86" y="364" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#78350f">모양(HTML+CSS)과 행동(JS)의 차이를</text>
  <text x="86" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#78350f">한 문장으로 말할 수 있다</text>

  <rect x="655" y="278" width="565" height="110" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <path d="M681 322 l8 8 l16 -18" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="717" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#1e40af">3대 트리거 구분</text>
  <text x="681" y="364" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e3a8a">click · scroll · mousemove가</text>
  <text x="681" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e3a8a">각각 언제 쓰이는지 사례로 안다</text>

  <rect x="60" y="404" width="565" height="110" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <path d="M86 448 l8 8 l16 -18" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="122" y="456" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#15803d">실습 3종 완성</text>
  <text x="86" y="490" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">클릭 토글 / 스크롤 등장 / 마우스 추적을</text>
  <text x="86" y="510" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">내 페이지에 직접 붙인다</text>

  <rect x="655" y="404" width="565" height="110" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <path d="M681 448 l8 8 l16 -18" fill="none" stroke="#374151" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="717" y="456" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#374151">재현 가능성</text>
  <text x="681" y="490" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">다음에 비슷한 효과가 필요할 때</text>
  <text x="681" y="510" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">클로드에게 어떻게 요청할지 안다</text>

  <!-- 진행률 바 -->
  <text x="60" y="558" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">진행률 — Step 4 (정적 페이지가 동적 페이지로 진화)</text>
  <rect x="60" y="572" width="1160" height="22" rx="11" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="60" y="572" width="580" height="22" rx="11" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="350" y="588" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#15803d">1주 · 2주 · 3주 · 4주 인터랙션</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">목표는 외우는 게 아니라 직접 클릭해서 반응을 보는 '경험'입니다</text>
</svg>
