<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 04</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">JS의 역할 — 사진에서 작동하는 건물로</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">HTML · CSS · JS의 역할 분담을 건물에 비유하면 한 번에 이해됩니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">역할 · 비유 · 예시</text>

  <!-- HTML 카드 (노랑) -->
  <rect x="60" y="278" width="360" height="290" rx="16" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <text x="84" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="42" font-weight="900" fill="#d97706">HTML</text>
  <line x1="84" y1="350" x2="396" y2="350" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="84" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#92400e">건물의 뼈대</text>
  <text x="84" y="416" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#78350f">벽 · 문 · 창문</text>
  <text x="84" y="442" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#78350f">무엇이 어디 있는지 구조를</text>
  <text x="84" y="464" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#78350f">잡아주는 골격</text>
  <text x="84" y="540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#d97706">예: 제목 · 문단 · 버튼 자리</text>

  <!-- CSS 카드 (파랑) -->
  <rect x="460" y="278" width="360" height="290" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="484" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="42" font-weight="900" fill="#2563eb">CSS</text>
  <line x1="484" y1="350" x2="796" y2="350" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="484" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#1e40af">인테리어</text>
  <text x="484" y="416" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e3a8a">색 · 폰트 · 배치</text>
  <text x="484" y="442" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e3a8a">같은 뼈대를 예쁘게 꾸미는</text>
  <text x="484" y="464" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e3a8a">도색과 가구 배치</text>
  <text x="484" y="540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#2563eb">예: 색상 · 그림자 · 정렬</text>

  <!-- JS 카드 (초록) -->
  <rect x="860" y="278" width="360" height="290" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="884" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="42" font-weight="900" fill="#16a34a">JS</text>
  <line x1="884" y1="350" x2="1196" y2="350" stroke="#86efac" stroke-width="1.5"/>
  <text x="884" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#15803d">행동 · 기계장치</text>
  <text x="884" y="416" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">엘리베이터 · 자동문 · 조명</text>
  <text x="884" y="442" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">사람이 들어가 작동시키는</text>
  <text x="884" y="464" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">움직이는 장치</text>
  <text x="884" y="540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#16a34a">예: 클릭 · 스크롤 반응</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">HTML+CSS만 있으면 '사진 속 건물' — JS가 더해지면 '작동하는 건물'</text>
</svg>
