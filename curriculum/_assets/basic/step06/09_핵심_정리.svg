  <text x="120" y="354" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#171717">CSS는 결과를 그리고, JS는 좌표를 구한다</text>

