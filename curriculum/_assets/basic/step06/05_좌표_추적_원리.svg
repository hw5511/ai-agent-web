<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 06</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">개념 ③ — 좌표 추적의 원리</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">마우스 위치가 어떻게 숫자로 들어오는지 직관으로 봅니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">화면 좌표계</text>

  <!-- 좌표계 그림 -->
  <rect x="60" y="278" width="560" height="290" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="80" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">(0, 0) 화면 왼쪽 위 기준</text>
  <!-- 축 -->
  <line x1="96" y1="320" x2="96" y2="540" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="96" y1="320" x2="600" y2="320" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="610" y="325" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#9ca3af">X →</text>
  <text x="84" y="556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#9ca3af">Y ↓</text>
  <!-- 요소 박스 -->
  <rect x="200" y="400" width="150" height="90" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="275" y="450" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">버튼 요소</text>
  <!-- 마우스 점 -->
  <circle cx="470" cy="380" r="9" fill="#16a34a"/>
  <line x1="96" y1="380" x2="461" y2="380" stroke="#86efac" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="470" y1="320" x2="470" y2="371" stroke="#86efac" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="486" y="376" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#15803d">마우스</text>
  <text x="486" y="396" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#166534">(clientX, clientY)</text>
  <!-- 거리 점선 -->
  <line x1="470" y1="380" x2="275" y2="445" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="350" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#d97706">거리</text>

  <!-- 우측 설명 + 의사코드 -->
  <rect x="660" y="278" width="560" height="60" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="684" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#15803d">clientX · clientY</text>
  <text x="684" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">화면 왼쪽 위(0,0) 기준 마우스 픽셀 위치</text>

  <rect x="660" y="350" width="560" height="60" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="684" y="376" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#92400e">거리 계산</text>
  <text x="684" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#78350f">가로차 · 세로차로 버튼까지 멀고 가까움 판단</text>

  <!-- 의사코드 다크박스 -->
  <rect x="660" y="422" width="560" height="146" rx="12" fill="#0f172a"/>
  <text x="684" y="452" font-family="'Courier New',monospace" font-size="14" fill="#6b7280">// 흐름만 보면 됩니다 — 외우지 않아도 됩니다</text>
  <text x="684" y="482" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">화면에서 마우스 좌표 가져옴</text>
  <text x="684" y="510" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">→ 버튼 중심까지 거리 계산</text>
  <text x="684" y="538" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">→ 가까우면 버튼을 마우스 쪽으로 이동</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">수식은 외울 필요 없습니다 — Claude Code가 짜주고, 우리는 흐름만 압니다</text>
</svg>
