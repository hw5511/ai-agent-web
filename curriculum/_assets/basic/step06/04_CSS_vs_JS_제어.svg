<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 06</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">개념 ② — CSS와 JS의 역할 나누기</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">같은 "움직임"이라도 CSS와 JS가 맡는 일이 다릅니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">누가 무엇을 맡나</text>

  <!-- CSS 카드 파랑 -->
  <rect x="60" y="278" width="560" height="180" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="84" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#1e40af">CSS 담당 — 정해진 결과</text>
  <line x1="84" y1="334" x2="596" y2="334" stroke="#93c5fd" stroke-width="1"/>
  <text x="84" y="370" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e3a8a">• hover 상태 전환 (올렸다 / 뗐다)</text>
  <text x="84" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e3a8a">• rotateY 로 카드 뒤집기</text>
  <text x="84" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e3a8a">• scale 로 크기 키우기</text>

  <!-- JS 카드 초록 -->
  <rect x="660" y="278" width="560" height="180" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="684" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#15803d">JS 담당 — 변하는 입력값</text>
  <line x1="684" y1="334" x2="1196" y2="334" stroke="#86efac" stroke-width="1"/>
  <text x="684" y="370" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">• 실시간 마우스 좌표 읽기</text>
  <text x="684" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">• 버튼까지의 거리 계산</text>
  <text x="684" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">• 그 값을 CSS에 넘겨주기</text>

  <text x="60" y="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">조합 패턴 — JS가 값을 구하고, CSS transform이 그린다</text>

  <!-- 조합 흐름 칩 -->
  <rect x="60" y="522" width="280" height="56" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="200" y="556" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#15803d">mousemove 좌표 계산</text>
  <text x="362" y="557" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" fill="#9ca3af">→</text>
  <rect x="384" y="522" width="220" height="56" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="494" y="556" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1e40af">CSS transform 적용</text>
  <text x="626" y="557" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" fill="#9ca3af">→</text>
  <rect x="648" y="522" width="220" height="56" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="758" y="556" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">화면에 움직임</text>
  <rect x="908" y="522" width="312" height="56" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="1064" y="548" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#92400e">Flip = CSS 단독</text>
  <text x="1064" y="568" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#78350f">마그네틱 · Spotlight = JS + CSS</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">Claude Code가 알아서 나눠 짭니다 — 우리는 "왜 그렇게 나누는지" 감만 잡으면 됩니다</text>
</svg>
