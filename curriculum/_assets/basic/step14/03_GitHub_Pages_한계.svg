<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 14</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">개념 ① — GitHub Pages의 한계</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">왜 떠나야 할까 — 'API 키 숨길 곳이 없다'</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">키를 코드에 박으면 벌어지는 일</text>

  <!-- 좌: F12 패널 mock (다크 코드 박스) -->
  <rect x="60" y="278" width="560" height="190" rx="12" fill="#0f172a"/>
  <text x="84" y="308" font-family="'Courier New',monospace" font-size="14" fill="#94a3b8">F12 개발자도구 — 소스 보기</text>
  <line x1="84" y1="320" x2="596" y2="320" stroke="#334155" stroke-width="1"/>
  <text x="84" y="354" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">&lt;script&gt;</text>
  <!-- 빨간 박스로 키 강조 -->
  <rect x="84" y="368" width="490" height="34" rx="6" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="98" y="391" font-family="'Courier New',monospace" font-size="15" fill="#fca5a5">const API_KEY = "sk-xxxxxxxx";</text>
  <text x="84" y="430" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">&lt;/script&gt;</text>
  <text x="84" y="458" font-family="'Courier New',monospace" font-size="13" fill="#6b7280">// 누구나 이 줄을 그대로 볼 수 있다</text>

  <!-- 우: 도둑 + 요금폭탄 말풍선 (빨강 = 보안) -->
  <rect x="660" y="278" width="560" height="190" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <!-- 자물쇠 열린 아이콘 (vector) -->
  <rect x="700" y="332" width="44" height="36" rx="6" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 708 332 L 708 318 a 14 14 0 0 1 28 0" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="770" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#991b1b">키가 노출되면</text>
  <text x="770" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#b91c1c">남이 내 키를 복사해서 마음대로 사용</text>
  <!-- 말풍선 -->
  <rect x="700" y="392" width="480" height="56" rx="12" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="724" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#dc2626">"내 키로 결제됨" — 요금 폭탄 가능</text>

  <!-- 하단 표: GitHub Pages 능력 -->
  <text x="60" y="510" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">GitHub Pages가 할 수 있는 것</text>
  <rect x="60" y="528" width="373" height="64" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="84" y="558" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#374151">정적 파일</text>
  <!-- O 체크마크 (vector) -->
  <path d="M 388 555 l 8 9 16 -19" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">HTML · CSS · JS 그대로 전송</text>

  <rect x="453" y="528" width="373" height="64" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="477" y="558" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#991b1b">서버에서 도는 코드</text>
  <!-- X 마크 (vector) -->
  <path d="M 793 547 l 18 18 M 811 547 l -18 18" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <text x="477" y="580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#b91c1c">없음 — 키를 가릴 방법이 없다</text>

  <rect x="846" y="528" width="374" height="64" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="870" y="558" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#991b1b">비밀값 보관함</text>
  <!-- X 마크 (vector) -->
  <path d="M 1187 547 l 18 18 M 1205 547 l -18 18" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <text x="870" y="580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#b91c1c">없음 — 키가 코드에 그대로 노출</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">'서버에서 도는 코드'가 없으면 키를 가릴 수 없다 — 그래서 환경을 갈아탑니다</text>
</svg>
