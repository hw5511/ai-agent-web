<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 14</text>
  <rect x="144" y="44" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d1d5db" stroke-width="1"/>
  <text x="170" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.05em">실습 3</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 ③ — 환경변수 + 내 도메인 연결</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">키를 금고에 넣고, 13주에 산 도메인을 Vercel 사이트로 연결</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 좌 칼럼: 환경변수 (빨강 = 보안) -->
  <rect x="60" y="240" width="565" height="290" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="84" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#dc2626" letter-spacing="0.06em">PART A</text>
  <text x="84" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#991b1b">환경변수에 키 보관</text>
  <line x1="84" y1="318" x2="601" y2="318" stroke="#fca5a5" stroke-width="1"/>
  <text x="84" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#b91c1c">1) OpenWeather 무료 키 발급 (강사 시연)</text>
  <text x="84" y="374" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#b91c1c">2) Vercel → Settings → Environment Variables</text>
  <text x="84" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#b91c1c">3) OPENWEATHER_KEY 추가 → Save → Redeploy</text>
  <!-- 코드 한 줄 (다크) -->
  <rect x="84" y="416" width="517" height="42" rx="8" fill="#0f172a"/>
  <text x="100" y="442" font-family="'Courier New',monospace" font-size="14" fill="#a3e635">process.env.OPENWEATHER_KEY</text>
  <!-- 지시문 미니박스 -->
  <rect x="84" y="468" width="517" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="100" y="490" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e40af">"api/weather.js 함수 만들어서 그 키로 날씨 조회.</text>
  <text x="100" y="508" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e40af">클라이언트엔 키 노출 X."</text>

  <!-- 우 칼럼: 도메인 연결 (파랑 = 도메인) -->
  <rect x="655" y="240" width="565" height="290" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="679" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.06em">PART B</text>
  <text x="679" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#1e40af">내 도메인 연결</text>
  <line x1="679" y1="318" x2="1196" y2="318" stroke="#93c5fd" stroke-width="1"/>
  <text x="679" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1d4ed8">1) Vercel → Settings → Domains</text>
  <text x="679" y="374" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1d4ed8">2) 13주에 산 도메인 주소 입력</text>
  <text x="679" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1d4ed8">3) 가비아 등에서 안내된 DNS 레코드 추가</text>
  <text x="679" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1d4ed8">4) 5~30분 대기 → 내 도메인으로 접속 확인</text>
  <!-- 도메인 → Vercel 흐름 -->
  <rect x="679" y="448" width="220" height="56" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="789" y="474" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">13주 내 도메인</text>
  <text x="789" y="494" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#1d4ed8">mysite.com</text>
  <text x="930" y="482" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" fill="#9ca3af">→</text>
  <rect x="976" y="448" width="220" height="56" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="1086" y="474" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">Vercel 사이트</text>
  <text x="1086" y="494" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#1d4ed8">xxx.vercel.app</text>

  <!-- 하단 체크리스트 -->
  <rect x="60" y="542" width="1160" height="56" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="84" y="558" width="104" height="22" rx="11" fill="#16a34a"/>
  <text x="136" y="573" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">확인해보세요</text>
  <text x="204" y="577" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">· F12 Network 탭에서 키가 안 보인다  · 내 도메인으로 사이트가 열린다 (전파 대기 OK)</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">환경변수 추가 후엔 꼭 Redeploy — 도메인은 다음 시간까지 천천히 붙어도 괜찮습니다</text>
</svg>
