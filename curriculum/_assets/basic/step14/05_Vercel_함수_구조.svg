<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 14</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">개념 ③ — Vercel 함수의 구조</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">외울 건 하나 — 'api 폴더에 파일 하나 = 주소 하나'</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 좌: 폴더 트리 (다크 코드 박스) -->
  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">파일 하나 = 주소 하나</text>
  <rect x="60" y="278" width="560" height="220" rx="12" fill="#0f172a"/>
  <text x="84" y="316" font-family="'Courier New',monospace" font-size="16" fill="#a3e635">my-site/</text>
  <text x="100" y="346" font-family="'Courier New',monospace" font-size="16" fill="#94a3b8">|-- index.html</text>
  <text x="100" y="376" font-family="'Courier New',monospace" font-size="16" fill="#a3e635">|-- api/</text>
  <text x="124" y="406" font-family="'Courier New',monospace" font-size="16" fill="#a3e635">|-- hello.js</text>
  <text x="360" y="406" font-family="'Courier New',monospace" font-size="15" fill="#38bdf8">-&gt; /api/hello</text>
  <text x="124" y="436" font-family="'Courier New',monospace" font-size="16" fill="#a3e635">`-- weather.js</text>
  <text x="360" y="436" font-family="'Courier New',monospace" font-size="15" fill="#38bdf8">-&gt; /api/weather</text>
  <text x="84" y="476" font-family="'Courier New',monospace" font-size="13" fill="#6b7280">// api 폴더 안 파일 = 부를 수 있는 주소</text>

  <!-- 우: 통신 다이어그램 (수직 스택) -->
  <text x="660" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">왜 키가 안 새는가</text>
  <!-- 브라우저 -->
  <rect x="660" y="278" width="560" height="56" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="684" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#374151">브라우저 (내 화면)</text>
  <text x="684" y="327" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">fetch('/api/hello') 로 호출</text>
  <text x="940" y="356" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#9ca3af">↓  부탁</text>
  <!-- Vercel 함수 (초록, 키 보유) -->
  <rect x="660" y="368" width="560" height="64" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="684" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#15803d">Vercel 함수 (서버에서만 돈다, 키 보유)</text>
  <text x="684" y="421" font-family="'Courier New',monospace" font-size="14" fill="#166534">process.env.MY_KEY — 브라우저는 절대 못 봄</text>
  <text x="940" y="454" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#9ca3af">↓  키 사용</text>
  <!-- 외부 서비스 -->
  <rect x="660" y="466" width="560" height="32" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="684" y="488" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">외부 데이터를 주는 서비스 → 결과만 화면으로</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">함수 안 코드는 Vercel 서버에서만 돌고 브라우저엔 결과만 옵니다 — 그래서 키가 안 샙니다</text>
</svg>
