  <text x="120" y="470" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="500" fill="#171717">Claude Code에게 추가·조회 코드 부탁 (URL·key 함께 전달)</text>

