  <text x="120" y="370" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="500" fill="#171717">컬럼 추가 · nickname (text) · message (text)</text>

