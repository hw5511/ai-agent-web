  <text x="60" y="178" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#6b7280">guestbook 테이블 만들고, 데이터 1건을 클라우드에 저장·조회</text>

