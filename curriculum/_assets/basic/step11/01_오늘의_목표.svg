<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 11</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">11회차 — 클라우드 DB로 도약</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">내 컴퓨터에만 있던 데이터를 모두가 공유하는 클라우드 DB로 옮깁니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">내 컴퓨터만 → 모두가 공유</text>

  <!-- 노트북 1대 (내 컴퓨터만) -->
  <rect x="60" y="286" width="320" height="150" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="170" y="318" width="100" height="62" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <rect x="156" y="380" width="128" height="8" rx="3" fill="#d1d5db"/>
  <text x="220" y="412" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#374151">노트북 1대</text>
  <text x="220" y="434" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">지난 주 — 나만 보임</text>

  <text x="404" y="368" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="34" fill="#9ca3af">→</text>

  <!-- 구름 (Supabase 클라우드 DB) -->
  <rect x="428" y="286" width="320" height="150" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <ellipse cx="588" cy="350" rx="62" ry="30" fill="#bfdbfe"/>
  <ellipse cx="556" cy="358" rx="34" ry="22" fill="#bfdbfe"/>
  <ellipse cx="620" cy="358" rx="38" ry="24" fill="#bfdbfe"/>
  <text x="588" y="356" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">DB</text>
  <text x="588" y="412" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#1e40af">클라우드 DB</text>
  <text x="588" y="434" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#2563eb">Supabase — 인터넷에 저장</text>

  <text x="772" y="368" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="34" fill="#9ca3af">→</text>

  <!-- 여러 기기 (모두가 공유) -->
  <rect x="796" y="286" width="424" height="150" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <rect x="846" y="324" width="84" height="52" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="958" y="330" width="40" height="64" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="1026" y="324" width="84" height="52" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="1008" y="412" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#15803d">여러 노트북 · 스마트폰</text>
  <text x="1008" y="434" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#16a34a">친구가 다른 기기에서 내 글을 봅니다</text>

  <text x="60" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">오늘 회차 한눈에</text>

  <rect x="60" y="506" width="560" height="86" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="84" y="542" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#374151">심화 트랙 · Part 2 · 2시간</text>
  <text x="84" y="570" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">1개념 = 클라우드 DB 연결 (Supabase)</text>

  <rect x="660" y="506" width="560" height="86" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="684" y="542" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#1e40af">회차 끝 도착점</text>
  <text x="684" y="570" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#1e40af">클라우드 DB에 글이 쌓이는 방명록 페이지 1개</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">어제까지 내 컴퓨터만 → 오늘부터 모두가 함께 보는 데이터</text>
</svg>
