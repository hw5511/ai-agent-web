<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 11</text>
  <rect x="144" y="44" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d1d5db" stroke-width="1"/>
  <text x="170" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.05em">실습 3</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 ③ + 정리 — 방명록을 클라우드로</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">지난 주 방명록을 Supabase로 전환 — 다른 사람도 볼 수 있게</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Claude 지시문 박스 -->
  <rect x="60" y="234" width="1160" height="68" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="84" y="250" width="104" height="22" rx="11" fill="#2563eb"/>
  <text x="136" y="265" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Claude 지시문</text>
  <text x="208" y="269" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#1e40af">"지난 주 LocalStorage로 만든 방명록을 Supabase로 옮겨줘."</text>
  <text x="84" y="293" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#2563eb">변경 포인트: localStorage.getItem/setItem → supabase.from('guestbook').select()/insert()</text>

  <text x="60" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">오늘 얻은 것 3가지</text>

  <!-- 정리 3카드 (노랑→파랑→초록) -->
  <rect x="60" y="358" width="373" height="158" rx="16" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="84" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="30" font-weight="900" fill="#d97706">01</text>
  <text x="84" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#92400e">클라우드 DB 연결</text>
  <line x1="84" y1="444" x2="409" y2="444" stroke="#fcd34d" stroke-width="1"/>
  <text x="84" y="472" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#78350f">Supabase 가입 · 프로젝트 생성</text>
  <text x="84" y="496" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#78350f">테이블을 인터넷 주소로 사용</text>

  <rect x="453" y="358" width="373" height="158" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="477" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="30" font-weight="900" fill="#2563eb">02</text>
  <text x="477" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#1e40af">CRUD 4종 패턴</text>
  <line x1="477" y1="444" x2="802" y2="444" stroke="#93c5fd" stroke-width="1"/>
  <text x="477" y="472" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#1e3a8a">추가 · 조회 · 수정 · 삭제</text>
  <text x="477" y="496" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#1e3a8a">from('테이블').동작() 공통 형태</text>

  <rect x="846" y="358" width="374" height="158" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="870" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="30" font-weight="900" fill="#16a34a">03</text>
  <text x="870" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#15803d">공유 방명록 완성</text>
  <line x1="870" y1="444" x2="1196" y2="444" stroke="#86efac" stroke-width="1"/>
  <text x="870" y="472" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">다른 기기 · 다른 사람도 열람</text>
  <text x="870" y="496" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">대시보드에서 데이터 직접 확인</text>

  <!-- 검증 체크리스트 -->
  <rect x="60" y="532" width="1160" height="60" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="84" y="548" width="64" height="22" rx="11" fill="#16a34a"/>
  <text x="116" y="563" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">검증</text>
  <text x="168" y="568" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">가입 O  ·  테이블 O  ·  추가·조회 O  ·  친구 폰으로 접속하니 내 글이 보이면 완성</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">다음 12회차 — 회원 시스템: 이 글을 누가 썼는지 기록하기 (로그인·내 글만 수정)</text>
</svg>
