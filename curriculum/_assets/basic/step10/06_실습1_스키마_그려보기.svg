<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 10</text>
  <rect x="144" y="44" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d1d5db" stroke-width="1"/>
  <text x="170" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.05em">실습 1</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 ① — 내 페이지의 표 그려보기</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">Claude와 대화하며 내 페이지에 어울리는 컬럼을 설계한다 (20분)</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Claude 지시문 박스 -->
  <rect x="60" y="240" width="1160" height="108" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="84" y="258" width="104" height="22" rx="11" fill="#2563eb"/>
  <text x="136" y="273" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Claude 지시문</text>
  <text x="84" y="312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#1e40af">"내 페이지에 방명록 기능을 추가하고 싶어. 어떤 컬럼(이름·메시지·날짜 등)이</text>
  <text x="84" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#1e40af">필요한지 표로 정리해줘."</text>

  <!-- 좌측: 작업 흐름 + 추천 주제 -->
  <text x="60" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">작업 흐름</text>
  <rect x="60" y="404" width="560" height="106" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="84" y="436" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">주제 떠올리기  →  컬럼 추천받기  →  표로 확정</text>
  <text x="84" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af">추천 주제</text>
  <text x="84" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">방명록 · 후기 · 일기 · 작품 갤러리 · 모임 신청</text>

  <!-- 우측: 예시 결과 표 (노랑) -->
  <text x="660" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">예시 결과 표</text>
  <rect x="660" y="404" width="560" height="106" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="690" y="436" font-family="'Courier New',monospace" font-size="14" fill="#92400e">id (숫자, 자동)</text>
  <text x="690" y="462" font-family="'Courier New',monospace" font-size="14" fill="#78350f">name (텍스트, 필수)  ·  message (텍스트, 필수)</text>
  <text x="690" y="488" font-family="'Courier New',monospace" font-size="14" fill="#92400e">created_at (날짜, 자동)</text>

  <!-- 확인 박스 (초록) -->
  <rect x="60" y="526" width="1160" height="70" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="84" y="542" width="104" height="22" rx="11" fill="#16a34a"/>
  <text x="136" y="557" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">확인해보세요</text>
  <text x="84" y="585" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#166534">• id·생성날짜가 자동 컬럼으로 들어갔나  • 컬럼은 3~5개로 시작 (처음부터 10개 X)</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">표가 잘 나와야 다음 실습이 술술 — 여기서 시간을 좀 써도 됩니다</text>
</svg>
