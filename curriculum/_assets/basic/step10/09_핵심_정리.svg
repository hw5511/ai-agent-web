<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 10</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">10회차 핵심 정리 — 내 컴퓨터를 넘어서</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">오늘 배운 3가지 + 한계를 통해 다음 주로 연결</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">오늘 배운 것 3가지</text>

  <!-- 카드 01 (노랑) -->
  <rect x="60" y="272" width="360" height="170" rx="16" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="84" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="34" font-weight="900" fill="#d97706">01</text>
  <text x="84" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#92400e">표로 설계</text>
  <line x1="84" y1="368" x2="396" y2="368" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="84" y="396" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#78350f">데이터는 '표'로 설계한다</text>
  <text x="84" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#d97706">스키마</text>

  <!-- 카드 02 (파랑) -->
  <rect x="460" y="272" width="360" height="170" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="484" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="34" font-weight="900" fill="#2563eb">02</text>
  <text x="484" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#1e40af">서랍에 저장</text>
  <line x1="484" y1="368" x2="796" y2="368" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="484" y="396" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#1e3a8a">브라우저 서랍에 저장한다</text>
  <text x="484" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#2563eb">LocalStorage</text>

  <!-- 카드 03 (초록) -->
  <rect x="860" y="272" width="360" height="170" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="884" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="34" font-weight="900" fill="#16a34a">03</text>
  <text x="884" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#15803d">함께 움직인다</text>
  <line x1="884" y1="368" x2="1196" y2="368" stroke="#86efac" stroke-width="1.5"/>
  <text x="884" y="396" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">화면과 저장소는 항상 같이</text>
  <text x="884" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#16a34a">표시 · 삭제</text>

  <!-- 비교 표: 오늘 vs 다음 주 -->
  <text x="60" y="490" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">솔직한 한계 — 그래서 다음 주가 필요합니다</text>
  <rect x="60" y="506" width="1160" height="92" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- 헤더 -->
  <text x="380" y="534" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#9ca3af">브라우저 서랍 (오늘)</text>
  <text x="900" y="534" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">클라우드 (다음 주)</text>
  <line x1="640" y1="520" x2="640" y2="584" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="84" y1="546" x2="1196" y2="546" stroke="#e5e7eb" stroke-width="1"/>
  <text x="100" y="572" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">친구도 보임?</text>
  <text x="380" y="572" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#9ca3af">X — 내 브라우저에만</text>
  <text x="660" y="572" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#1e3a8a">O — 인터넷 너머에 저장</text>
  <text x="900" y="572" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#2563eb">친구 글이 내 화면에도</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">다음 주 11회차 — Vercel을 활용한 DB·API 연동, 회원 시스템·진짜 사이트로 배포의 첫 발</text>
</svg>
