<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 12</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">개념 ② — Supabase Auth 한눈에</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">복잡한 회원 시스템을 Supabase가 통째로 대신 만들어줍니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">들어오는 방법 → Supabase Auth → 알아서 처리</text>

  <!-- 들어오는 3가지 -->
  <rect x="60" y="280" width="240" height="44" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="180" y="308" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">이메일 + 비밀번호</text>
  <rect x="60" y="334" width="240" height="44" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="180" y="362" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">구글 로그인</text>
  <rect x="60" y="388" width="240" height="44" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="180" y="416" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">깃허브 로그인</text>

  <text x="328" y="362" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="30" fill="#9ca3af">→</text>

  <!-- 중앙 큰 박스 -->
  <rect x="360" y="280" width="280" height="152" rx="16" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  <text x="500" y="346" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#6d28d9">Supabase</text>
  <text x="500" y="378" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#6d28d9">Auth</text>
  <text x="500" y="408" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#7c3aed">회원 시스템 통째로</text>

  <text x="668" y="362" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="30" fill="#9ca3af">→</text>

  <!-- 나가는 결과 -->
  <rect x="700" y="280" width="476" height="70" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="724" y="312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#15803d">회원 명단 자동 관리</text>
  <text x="724" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">가입하면 명단 테이블에 자동 추가</text>
  <rect x="700" y="362" width="476" height="70" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="724" y="394" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#15803d">로그인 상태 자동 유지</text>
  <text x="724" y="418" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">창을 닫았다 다시 열어도 유지</text>

  <text x="60" y="476" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">직접 만들면 vs Supabase에 맡기면</text>

  <rect x="60" y="496" width="565" height="98" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="84" y="528" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#b91c1c">직접 만들면</text>
  <text x="84" y="556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#991b1b">회원 명단 보관 · 비밀번호 암호화</text>
  <text x="84" y="578" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#991b1b">로그인 상태 보관 · 메일 발송 …</text>

  <rect x="655" y="496" width="565" height="98" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="679" y="528" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#15803d">Supabase에 맡기면</text>
  <text x="679" y="556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">우리가 짜는 건 폼 화면과 버튼 클릭 정도</text>
  <text x="679" y="578" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">나머지는 한 줄 호출로 끝</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">"이걸 다 해준다고요?" — 네, 정말 다 해줍니다</text>
</svg>
