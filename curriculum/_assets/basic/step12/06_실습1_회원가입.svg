<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 12</text>
  <rect x="144" y="44" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d1d5db" stroke-width="1"/>
  <text x="170" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.05em">실습 1</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 ① — 회원가입 폼 만들기</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">이메일·비밀번호 입력 폼을 만들고 가입을 연동합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Claude 지시문 박스 -->
  <rect x="60" y="234" width="1160" height="68" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="84" y="250" width="104" height="22" rx="11" fill="#2563eb"/>
  <text x="136" y="265" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Claude 지시문</text>
  <text x="208" y="269" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#1e40af">"회원가입 폼(이메일·비번)을 만들고 Supabase Auth signUp으로 연동해줘."</text>
  <text x="84" y="293" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#2563eb">결과: 가입 버튼을 누르면 Supabase 회원 명단에 내 이메일이 추가됩니다</text>

  <text x="60" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">만들어지는 화면 → 확인하는 곳</text>

  <!-- 좌측 회원가입 폼 목업 -->
  <rect x="60" y="358" width="560" height="158" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="84" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">회원가입 폼</text>
  <rect x="84" y="404" width="512" height="28" rx="6" fill="#f3f4f6"/>
  <text x="96" y="423" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">이메일  —  test1@test.com</text>
  <rect x="84" y="440" width="512" height="28" rx="6" fill="#f3f4f6"/>
  <text x="96" y="459" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">비밀번호  —  ••••••</text>
  <rect x="84" y="478" width="512" height="28" rx="6" fill="#16a34a"/>
  <text x="340" y="497" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">가입하기</text>

  <!-- 우측 Supabase Users 목록 -->
  <rect x="660" y="358" width="560" height="158" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="684" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#15803d">Supabase 대시보드 — Authentication</text>
  <rect x="684" y="404" width="512" height="32" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <polyline points="700,420 706,426 716,414" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="730" y="425" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#166534">test1@test.com — 방금 추가됨</text>
  <text x="684" y="464" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#166534">가입 직후 Users 목록에 이메일이 보이면 성공</text>
  <text x="684" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#16a34a">성공·실패는 alert 메시지로 알려주면 충분</text>

  <!-- 코드박스 한 줄 -->
  <rect x="60" y="528" width="1160" height="60" rx="12" fill="#0f172a"/>
  <text x="84" y="554" font-family="'Courier New',monospace" font-size="13" fill="#6b7280">// 보여주기용 — 클로드가 짭니다</text>
  <text x="84" y="578" font-family="'Courier New',monospace" font-size="16" fill="#a3e635">await supabase.auth.signUp({ email, password })</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">함정 — 비밀번호 6자 이상, 이메일 형식 맞추기 / 가짜 이메일도 OK</text>
</svg>
