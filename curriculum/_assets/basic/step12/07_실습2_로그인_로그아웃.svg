<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 12</text>
  <rect x="144" y="44" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d1d5db" stroke-width="1"/>
  <text x="170" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.05em">실습 2</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 ② — 로그인 · 로그아웃 + 상태 표시</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">화면 상단에 "OOO님" 표시까지 완성합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Claude 지시문 박스 -->
  <rect x="60" y="234" width="1160" height="62" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="84" y="250" width="104" height="22" rx="11" fill="#2563eb"/>
  <text x="136" y="265" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Claude 지시문</text>
  <text x="208" y="271" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#1e40af">"로그인 폼·로그아웃 버튼 추가해줘. 로그인 상태가 화면 상단에 표시되도록."</text>

  <text x="60" y="334" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">상태 전환 흐름</text>

  <!-- 상태 전환 다이어그램 -->
  <rect x="60" y="356" width="300" height="56" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="210" y="390" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#374151">비로그인</text>
  <text x="400" y="390" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#9ca3af">로그인 →</text>
  <rect x="490" y="356" width="300" height="56" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="640" y="390" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#15803d">로그인됨</text>
  <text x="850" y="390" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#9ca3af">← 로그아웃</text>
  <rect x="920" y="356" width="300" height="56" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="1070" y="390" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#374151">다시 비로그인</text>

  <text x="60" y="450" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">화면 상단 — 로그인 전 / 후</text>

  <!-- 헤더 비교 목업 -->
  <rect x="60" y="470" width="560" height="60" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="84" y="506" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">내 사이트</text>
  <rect x="510" y="488" width="86" height="24" rx="6" fill="#16a34a"/>
  <text x="553" y="505" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">로그인</text>

  <rect x="660" y="470" width="560" height="60" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="684" y="506" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#15803d">안녕하세요, OOO님</text>
  <rect x="1100" y="488" width="96" height="24" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="1148" y="505" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#15803d">로그아웃</text>

  <!-- 코드박스 -->
  <rect x="60" y="546" width="1160" height="56" rx="12" fill="#0f172a"/>
  <text x="84" y="572" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">supabase.auth.signInWithPassword({ email, password })</text>
  <text x="700" y="572" font-family="'Courier New',monospace" font-size="15" fill="#a3e635">supabase.auth.signOut()</text>
  <text x="84" y="592" font-family="'Courier New',monospace" font-size="13" fill="#94a3b8">// 새로고침해도 로그인 유지 — 브라우저가 자동으로 기억합니다</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">로그인 직후 화면이 안 바뀌면 — "로그인 즉시 화면 갱신되게" 한 줄 추가 요청</text>
</svg>
