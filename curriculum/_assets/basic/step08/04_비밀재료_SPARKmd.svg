  <text x="100" y="356" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#171717">분위기·인터랙션·폰트 판단 기준을 담는다</text>

