  <text x="776" y="432" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="600" fill="#171717">~/.claude/skills/spark 에 설치</text>

  <line x1="960" y1="466" x2="960" y2="488" stroke="#e5e7eb" stroke-width="1.5"/>

