  <text x="60" y="672" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">설치 → /skills 확인 · 영감 데이터는 스킬에 내장</text>
