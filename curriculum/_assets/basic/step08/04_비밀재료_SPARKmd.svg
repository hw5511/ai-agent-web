  <text x="84" y="508" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="500" fill="#374151">분위기·폰트 영감 모음 (강사가 직접 만든 저장소)</text>
