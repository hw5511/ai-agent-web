  <text x="728" y="538" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#9ca3af">03</text>
  <text x="776" y="538" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="600" fill="#171717">실습 B에서 같은 프롬프트 다시</text>

