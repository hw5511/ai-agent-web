<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs><style>@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css");text{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}</style></defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 08</text>
  <text x="60" y="130" font-size="40" font-weight="700" fill="#171717" letter-spacing="-0.01em">내 작품 보관함: GitHub</text>
  <text x="60" y="178" font-size="19" font-weight="400" fill="#6b7280">내 작품을 통째로 올려두는 온라인 창고</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="282" font-size="20" font-weight="500" fill="#9ca3af">─</text><text x="100" y="282" font-size="20" font-weight="500" fill="#171717">사라지지 않는다 — 백업</text>
  <text x="60" y="344" font-size="20" font-weight="500" fill="#9ca3af">─</text><text x="100" y="344" font-size="20" font-weight="500" fill="#171717">이력 관리 — 언제든 되돌리기</text>
  <text x="60" y="406" font-size="20" font-weight="500" fill="#9ca3af">─</text><text x="100" y="406" font-size="20" font-weight="500" fill="#171717">공유 주소로 보여주기</text>
  <text x="60" y="560" font-size="24" font-weight="700" fill="#16a34a">복잡한 명령어 없이 — 창고(GitHub)만 기억하면 된다</text>
</svg>
