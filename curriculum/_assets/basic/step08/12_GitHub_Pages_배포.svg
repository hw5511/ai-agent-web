<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style>text { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; }</style>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="20" y="24" width="84" height="28" rx="4" fill="#171717"/>
  <text x="62" y="44" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="1">WEB 08</text>
  <text x="640" y="100" text-anchor="middle" font-size="48" font-weight="800" fill="#171717">GitHub Pages 배포</text>
  <rect x="360" y="116" width="560" height="4" rx="2" fill="#16a34a"/>
  <rect x="60" y="153" width="580" height="200" rx="12" fill="#171717"/>
  <rect x="60" y="153" width="580" height="6" rx="3" fill="#16a34a"/>
  <text x="120" y="211" font-size="18" font-weight="700" fill="#16a34a">💬 프롬프트</text>
  <rect x="80" y="230" width="540" height="2" fill="#374151"/>
  <text x="350" y="290" text-anchor="middle" font-size="18" fill="#ffffff">이 포트폴리오를 GitHub에 올리고</text>
  <text x="350" y="326" text-anchor="middle" font-size="18" fill="#ffffff">GitHub Pages로 배포해줘. 레포 이름은 portfolio.</text>
  <rect x="60" y="377" width="580" height="296" rx="12" fill="#f3f4f6"/>
  <text x="120" y="420" font-size="17" fill="#374151">① Claude가 gh repo create portfolio 실행</text>
  <text x="120" y="464" font-size="17" fill="#374151">② .github/workflows/deploy.yml 생성</text>
  <text x="120" y="508" font-size="17" fill="#374151">③ git push → GitHub Actions 자동 빌드</text>
  <text x="120" y="552" font-size="17" fill="#374151">④ dist/ → GitHub Pages 업로드</text>
  <text x="120" y="608" font-size="17" font-weight="700" fill="#16a34a">⑤ 공개 URL 생성 완료!</text>
  <rect x="680" y="153" width="540" height="520" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="950" y="226" text-anchor="middle" font-size="22" font-weight="700" fill="#16a34a">배포 결과</text>
  <rect x="700" y="246" width="500" height="2" fill="#d1fae5"/>
  <text x="950" y="330" text-anchor="middle" font-size="56">&#x1F310;</text>
  <rect x="720" y="406" width="460" height="78" rx="10" fill="#ffffff"/>
  <text x="950" y="450" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="600" fill="#171717">내아이디.github.io/portfolio</text>
  <text x="950" y="548" text-anchor="middle" font-size="18" fill="#374151">push할 때마다</text>
  <text x="950" y="586" text-anchor="middle" font-size="18" fill="#374151">자동으로 재배포</text>
  <text x="950" y="636" text-anchor="middle" font-size="17" fill="#6b7280">무료 · 영구 · 공개</text>
</svg>