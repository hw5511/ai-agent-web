<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 08</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">오늘, 내 사이트가 인터넷에 살아난다</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">Session 8 — 1부의 클라이맥스. 끝나면 진짜 인터넷 주소가 생깁니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">오늘의 한 개념</text>

  <!-- 큰 다크 히어로 박스 -->
  <rect x="60" y="284" width="1160" height="232" rx="16" fill="#0f172a"/>
  <text x="100" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="0.08em">Session 8 — Climax</text>
  <text x="100" y="402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="44" font-weight="900" fill="#ffffff">인터넷에 내 사이트 띄우기</text>
  <text x="100" y="444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#94a3b8">지난 7주는 워밍업이었어요. 오늘 끝나면 누구나 들어올 수 있는 주소가 생깁니다.</text>

  <!-- URL 모형 -->
  <rect x="100" y="466" width="560" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="120" y="489" font-family="'Courier New',monospace" font-size="16" fill="#a3e635">https://hw5511.github.io/내이름</text>

  <!-- 회차 키워드 칩 -->
  <rect x="60" y="540" width="565" height="56" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="88" y="575" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#92400e">메타 정리 — 7주간 써 온 시스템을 한눈에</text>
  <rect x="655" y="540" width="565" height="56" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="683" y="575" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#1e40af">진짜 사이트로 배포 — 공개 URL 받기</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">코드 한 줄 직접 안 쳐도 됩니다 — 우리는 무엇을 시킬지만 결정하면 됩니다</text>
</svg>
