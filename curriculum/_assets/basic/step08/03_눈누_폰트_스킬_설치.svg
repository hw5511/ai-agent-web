<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs><style>@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css");text{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}</style></defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 08</text>
  <text x="60" y="130" font-size="40" font-weight="700" fill="#171717" letter-spacing="-0.01em">준비물 · 무료 폰트 스킬</text>
  <text x="60" y="178" font-size="19" font-weight="400" fill="#6b7280">포트폴리오에 입힐 무료 한글 폰트를 미리 준비한다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="282" font-size="20" font-weight="500" fill="#9ca3af">─</text>
  <text x="100" y="282" font-size="20" font-weight="500" fill="#171717">눈누 = 상업용 무료 한글 폰트 (약 1,120종)</text>
  <text x="60" y="344" font-size="20" font-weight="500" fill="#9ca3af">─</text>
  <text x="100" y="344" font-size="20" font-weight="500" fill="#171717">noonnu-fonts 스킬을 한 번만 설치해 둔다</text>
  <text x="60" y="406" font-size="20" font-weight="500" fill="#9ca3af">─</text>
  <text x="100" y="406" font-size="20" font-weight="500" fill="#171717">검색 → 대조표로 보고 → 웹폰트 적용</text>

  <rect x="680" y="250" width="540" height="240" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="708" y="288" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">설치 (한 번만 · Claude에게 한 줄)</text>
  <text x="708" y="336" font-size="18" font-weight="500" fill="#374151">github.com/hw5511/ai-agent-web 의</text>
  <text x="708" y="368" font-size="18" font-weight="500" fill="#374151">skills/noonnu-fonts 를 내 스킬로</text>
  <text x="708" y="400" font-size="18" font-weight="500" fill="#374151">설치해줘</text>
  <text x="708" y="452" font-size="15" fill="#9ca3af">~/.claude/skills/ 에 설치 → /noonnu-fonts 사용</text>

  <text x="60" y="600" font-size="24" font-weight="700" fill="#16a34a">폰트 고민은 눈누 스킬에게 — 골라서 적용만</text>
</svg>
