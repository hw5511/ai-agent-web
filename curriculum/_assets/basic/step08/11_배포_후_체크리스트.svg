<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs><style>@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css");</style></defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- WEB 08 배지 -->
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 08</text>

  <!-- 제목 -->
  <text x="60" y="130" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717" letter-spacing="-0.01em">URL 떴다 · 5분 점검</text>

  <!-- 부제 -->
  <text x="60" y="178" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#6b7280">흔한 막힘 · 모바일까지 열어본다</text>

  <!-- 구분선 -->
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 좌측: 체크리스트 -->
  <text x="80" y="262" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">CHECK</text>

  <rect x="80" y="290" width="20" height="20" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="120" y="307" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#171717">URL 접속됨</text>

  <rect x="80" y="340" width="20" height="20" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="120" y="357" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#171717">이미지 보임</text>

  <rect x="80" y="390" width="20" height="20" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="120" y="407" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#171717">폰트 적용됨</text>

  <rect x="80" y="440" width="20" height="20" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="120" y="457" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#171717">모바일에서도 열린다</text>

  <!-- 우측: 막혔을 때 카드 3개 -->
  <text x="630" y="262" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">막혔을 때 — Claude에게 이렇게 말한다</text>

  <rect x="630" y="288" width="570" height="92" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="654" y="318" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.06em">CASE · 404</text>
  <text x="654" y="354" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="500" fill="#171717">"Pages가 켜지는 데 1~2분 걸려요" — 잠시 대기</text>

  <rect x="630" y="394" width="570" height="92" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="654" y="424" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.06em">CASE · 이미지 깨짐</text>
  <text x="654" y="460" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="500" fill="#171717">"이미지 경로 상대경로로 고쳐줘"</text>

  <rect x="630" y="500" width="570" height="92" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="654" y="530" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.06em">CASE · 폰트 안 뜸</text>
  <text x="654" y="566" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="500" fill="#171717">"폰트 CDN 링크 점검해줘"</text>

  <!-- 그린 강조 한 줄 -->
  <text x="80" y="668" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="600" fill="#16a34a">진짜 사이트 — 휴대폰 꺼내 본인 URL을 본다</text>
</svg>
