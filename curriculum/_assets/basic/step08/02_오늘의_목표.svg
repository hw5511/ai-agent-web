<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs><style>@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css");text{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}</style></defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 08</text>
  <text x="60" y="130" font-size="40" font-weight="700" fill="#171717" letter-spacing="-0.01em">오늘의 목표</text>
  <text x="60" y="178" font-size="19" font-weight="400" fill="#6b7280">오늘 끝나면 할 수 있는 것</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="282" font-size="20" font-weight="500" fill="#9ca3af">─</text><text x="100" y="282" font-size="20" font-weight="500" fill="#171717">React가 뭔지 안다 — 컴포넌트 개념</text>
  <text x="60" y="344" font-size="20" font-weight="500" fill="#9ca3af">─</text><text x="100" y="344" font-size="20" font-weight="500" fill="#171717">MUI로 UI를 빠르게 조립한다</text>
  <text x="60" y="406" font-size="20" font-weight="500" fill="#9ca3af">─</text><text x="100" y="406" font-size="20" font-weight="500" fill="#171717">통합 프롬프트로 Claude에게 시킨다</text>
  <text x="60" y="468" font-size="20" font-weight="500" fill="#9ca3af">─</text><text x="100" y="468" font-size="20" font-weight="500" fill="#171717">포트폴리오를 만들어 인터넷에 배포한다</text>
  <text x="60" y="600" font-size="24" font-weight="700" fill="#16a34a">코드는 안 친다 — 개념만 알고 Claude에게 맡긴다</text>
</svg>
