  <text x="60" y="282" font-size="20" font-weight="500" fill="#9ca3af">─</text><text x="100" y="282" font-size="20" font-weight="500" fill="#171717">아래 프롬프트 입력</text>
  <text x="60" y="344" font-size="20" font-weight="500" fill="#9ca3af">─</text><text x="100" y="344" font-size="20" font-weight="500" fill="#171717">GitHub Actions 자동 생성</text>
  <text x="60" y="406" font-size="20" font-weight="500" fill="#9ca3af">─</text><text x="100" y="406" font-size="20" font-weight="500" fill="#171717">배포 URL 확인</text>
