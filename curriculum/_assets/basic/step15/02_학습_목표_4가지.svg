  <text x="80" y="500" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" fill="#16a34a">─</text>
  <text x="120" y="500" font-family="'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" fill="#16a34a">내 사이트 주제에 어울리는 AI 기능 1개를 직접 추가할 수 있다</text>

