<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 15</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">API 활용 — AI 기능 붙이기</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">Vercel 함수에서 OpenAI를 부르자 — 버튼 누르면 AI가 응답하는 내 사이트</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">오늘의 약속</text>

  <!-- 좌측: 결과물 박스 + 말풍선 미니 일러스트 -->
  <rect x="60" y="282" width="700" height="190" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="90" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#15803d">끝났을 때 결과물</text>
  <text x="90" y="364" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#166534">버튼 하나 누르면 AI가 응답하는 내 사이트</text>

  <!-- 말풍선 (벡터 도형) -->
  <rect x="90" y="390" width="280" height="56" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <polygon points="120,446 120,468 142,446" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="110" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#15803d">"요약해줘" → 3줄 요약 도착</text>

  <rect x="400" y="390" width="330" height="56" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <polygon points="430,446 430,468 452,446" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="420" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#15803d">"그려줘" → 이미지 한 장 도착</text>

  <!-- 우측: 오늘 만질 API 3종 -->
  <text x="800" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">오늘 만질 API 3종</text>
  <rect x="800" y="282" width="420" height="56" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="824" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#374151">OpenAI — 텍스트 작업</text>
  <rect x="800" y="349" width="420" height="56" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="824" y="383" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#374151">Stability — 이미지 생성</text>
  <rect x="800" y="416" width="420" height="56" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="824" y="450" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#374151">DeepL — 고품질 번역</text>

  <!-- 14 → 15 → 16 진행 막대 -->
  <text x="60" y="516" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">진행</text>
  <rect x="60" y="532" width="220" height="56" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="170" y="566" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#6b7280">14 Vercel 환경</text>
  <text x="298" y="567" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" fill="#9ca3af">→</text>
  <rect x="316" y="532" width="220" height="56" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="426" y="566" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#1e40af">15 AI 활용</text>
  <text x="554" y="567" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" fill="#9ca3af">→</text>
  <rect x="572" y="532" width="220" height="56" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="682" y="566" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#6b7280">16 결제</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">오늘은 무료 크레딧 안에서 가볍게 — AI 기능은 결국 "버튼 → 응답" 한 줄입니다</text>
</svg>
