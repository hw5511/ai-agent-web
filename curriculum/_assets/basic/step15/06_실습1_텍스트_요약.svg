<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 15</text>
  <rect x="144" y="44" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d1d5db" stroke-width="1"/>
  <text x="170" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.05em">실습 1</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 ① — 텍스트 요약 기능 만들기</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">글을 붙여넣으면 OpenAI가 3줄로 요약해 돌려줍니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Claude 지시문 박스 -->
  <rect x="60" y="240" width="1160" height="92" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="84" y="256" width="104" height="22" rx="11" fill="#2563eb"/>
  <text x="136" y="271" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Claude 지시문</text>
  <text x="84" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#1e40af">"환경변수 OPENAI_KEY 추가했어. api/summarize.js 만들어서 텍스트 입력 받아</text>
  <text x="84" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#1e40af">OpenAI로 3줄 요약해줘. 페이지에서 textarea + 버튼으로 호출."</text>

  <!-- 좌측: 화면 와이어프레임 -->
  <text x="60" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">화면 모양</text>
  <rect x="60" y="388" width="560" height="184" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="84" y="408" width="512" height="56" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="100" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#9ca3af">여기에 긴 글을 붙여넣기 (textarea)</text>
  <rect x="84" y="476" width="130" height="40" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="149" y="501" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#15803d">요약하기</text>
  <rect x="84" y="528" width="512" height="32" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="100" y="549" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#9ca3af">결과: 3줄 요약이 여기에 표시</text>

  <!-- 우측: 코드박스 골격 -->
  <text x="660" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">api/summarize.js — 골격 (보여주기용)</text>
  <rect x="660" y="388" width="560" height="184" rx="12" fill="#0f172a"/>
  <text x="684" y="420" font-family="'Courier New',monospace" font-size="14" fill="#6b7280">// Vercel 함수 — 외우지 않아도 됩니다</text>
  <text x="684" y="448" font-family="'Courier New',monospace" font-size="14" fill="#a3e635">const key = process.env.OPENAI_KEY;</text>
  <text x="684" y="476" font-family="'Courier New',monospace" font-size="14" fill="#a3e635">const r = await fetch("OpenAI 주소", {</text>
  <text x="684" y="504" font-family="'Courier New',monospace" font-size="14" fill="#a3e635">  headers: { Authorization: key },</text>
  <text x="684" y="532" font-family="'Courier New',monospace" font-size="14" fill="#a3e635">  body: "글 + 3줄로 요약 지시" });</text>
  <text x="684" y="560" font-family="'Courier New',monospace" font-size="14" fill="#6b7280">// 응답을 페이지로 돌려준다</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">긴 뉴스 본문을 붙이고 3줄 요약이 뜨면 성공 — 코드는 Claude가 씁니다</text>
</svg>
