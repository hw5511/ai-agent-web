<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 15</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">개념 ② — 오늘 다룰 AI API 3종</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">셋 다 무료 크레딧이 있고, 부르는 방식은 똑같습니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- OpenAI 카드 (노랑) -->
  <rect x="60" y="240" width="370" height="270" rx="16" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <text x="84" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#92400e">OpenAI (GPT)</text>
  <line x1="84" y1="300" x2="406" y2="300" stroke="#fcd34d" stroke-width="1"/>
  <text x="84" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#d97706">잘하는 것</text>
  <text x="84" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#78350f">텍스트 작업 — 요약·답변·작성</text>
  <text x="84" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#d97706">입력 → 출력</text>
  <text x="84" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#78350f">긴 글 → 3줄 요약</text>
  <text x="84" y="478" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#92400e">예: 자기소개 문구 자동 작성</text>

  <!-- Stability 카드 (파랑) -->
  <rect x="455" y="240" width="370" height="270" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="479" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#1e40af">Stability AI</text>
  <line x1="479" y1="300" x2="801" y2="300" stroke="#93c5fd" stroke-width="1"/>
  <text x="479" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#2563eb">잘하는 것</text>
  <text x="479" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#1e3a8a">이미지 생성 — 그림 그리기</text>
  <text x="479" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#2563eb">입력 → 출력</text>
  <text x="479" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#1e3a8a">설명 문장 → 그림 한 장</text>
  <text x="479" y="478" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#1e40af">예: "수채화 강아지" → 이미지</text>

  <!-- DeepL 카드 (초록) -->
  <rect x="850" y="240" width="370" height="270" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="874" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#15803d">DeepL</text>
  <line x1="874" y1="300" x2="1196" y2="300" stroke="#86efac" stroke-width="1"/>
  <text x="874" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#16a34a">잘하는 것</text>
  <text x="874" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#166534">고품질 번역 — 한국어·영어</text>
  <text x="874" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#16a34a">입력 → 출력</text>
  <text x="874" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#166534">한국어 문장 → 자연스러운 영어</text>
  <text x="874" y="478" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#15803d">예: 소개 글 영어 버전 만들기</text>

  <!-- 공통 패턴 다이어그램 -->
  <text x="60" y="548" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">셋 다 부르는 방식은 동일</text>
  <rect x="60" y="562" width="200" height="40" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="160" y="587" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">페이지 입력</text>
  <text x="280" y="588" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#9ca3af">→</text>
  <rect x="300" y="562" width="200" height="40" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="587" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#15803d">Vercel 함수</text>
  <text x="520" y="588" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#9ca3af">→</text>
  <rect x="540" y="562" width="200" height="40" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="640" y="587" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">AI API</text>
  <text x="760" y="588" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#9ca3af">→</text>
  <rect x="780" y="562" width="200" height="40" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="880" y="587" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1e40af">응답 표시</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">하나만 익히면 나머지 둘은 Claude Code가 같은 패턴으로 만들어 줍니다</text>
</svg>
