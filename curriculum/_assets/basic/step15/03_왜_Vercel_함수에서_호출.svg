<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="66" height="24" rx="12" fill="#171717"/>
  <text x="93" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">WEB 15</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">개념 ① — 왜 Vercel 함수에서 부르나</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">API 키 = 카드와 같습니다 — 브라우저에 적으면 누구나 봅니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">안전한 호출 경로</text>

  <!-- 안전 흐름도 -->
  <rect x="60" y="278" width="250" height="58" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="185" y="306" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#374151">브라우저(내 페이지)</text>
  <text x="185" y="326" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">키 모름</text>
  <text x="330" y="313" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" fill="#9ca3af">→</text>
  <rect x="350" y="278" width="250" height="58" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="475" y="306" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#15803d">Vercel 함수</text>
  <text x="475" y="326" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#16a34a">여기서만 키 사용</text>
  <text x="620" y="313" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" fill="#9ca3af">→</text>
  <rect x="640" y="278" width="250" height="58" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="765" y="306" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#374151">OpenAI 등 서비스</text>
  <text x="765" y="326" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">키 확인 후 응답</text>

  <!-- 위험 케이스 (빨강) -->
  <rect x="60" y="372" width="565" height="190" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <circle cx="100" cy="412" r="16" fill="#fca5a5"/>
  <path d="M93 405 L107 419 M107 405 L93 419" stroke="#991b1b" stroke-width="3" stroke-linecap="round"/>
  <text x="130" y="419" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#991b1b">위험 — 브라우저에 키를 적으면</text>
  <text x="84" y="462" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#b91c1c">· 누구나 F12(개발자도구)로 키를 그대로 본다</text>
  <text x="84" y="494" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#b91c1c">· 유출되면 남이 내 카드로 결제를 일으킨다</text>
  <text x="84" y="526" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#b91c1c">· 실제로 하룻밤 새 큰 비용이 빠진 사고가 있다</text>

  <!-- 안전 케이스 (초록) -->
  <rect x="655" y="372" width="565" height="190" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <circle cx="695" cy="412" r="16" fill="#86efac"/>
  <path d="M688 412 L693 418 L703 405" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="725" y="419" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#15803d">안전 — Vercel 함수 안에서만</text>
  <text x="679" y="462" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#166534">· 키는 환경변수에 보관, 화면엔 절대 안 보낸다</text>
  <text x="679" y="494" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#166534">· 브라우저는 Vercel 함수만 부른다 (키 모름)</text>
  <!-- 코드박스 (안전 카드 안) -->
  <rect x="679" y="510" width="517" height="38" rx="8" fill="#0f172a"/>
  <text x="695" y="535" font-family="'Courier New',monospace" font-size="14" fill="#a3e635">const key = process.env.OPENAI_KEY;</text>

  <rect x="60" y="618" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">키는 Vercel 함수 안에서만 읽는다 — 브라우저는 끝까지 키를 모릅니다</text>
</svg>
