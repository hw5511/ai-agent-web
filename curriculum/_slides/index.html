<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16주 슬라이드 목차 검토</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface2: #f5f5f5;
    --border: #e5e5e5;
    --border2: #d4d4d4;
    --text: #0a0a0a;
    --muted: #737373;
    --muted2: #a3a3a3;

    --part1-accent: #38bdf8;
    --part1-bg: #f0f9ff;
    --part1-border: #bae6fd;
    --part2-accent: #f59e0b;
    --part2-bg: #fffbeb;
    --part2-border: #fde68a;

    --code-bg: #0f172a;
    --code-text: #a3e635;

    --sidebar-w: 300px;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard Variable', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow: hidden;
  }

  .app {
    display: flex;
    height: 100vh;
  }

  /* 사이드바 */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 24px 24px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  .sidebar-header p {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }

  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
  }

  .part-header {
    padding: 16px 24px 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .part-header::before {
    content: '';
    display: block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--part-color, var(--muted));
  }
  .part-1 .part-header { --part-color: var(--part1-accent); }
  .part-2 .part-header { --part-color: var(--part2-accent); }

  .session-item {
    display: block;
    padding: 10px 24px;
    border: none;
    background: transparent;
    text-align: left;
    cursor: pointer;
    color: var(--text);
    font-size: 13px;
    line-height: 1.4;
    transition: background 0.12s;
    width: 100%;
    font-family: inherit;
  }
  .session-item:hover { background: var(--surface2); }
  .session-item.active {
    background: var(--part1-bg);
    color: var(--part1-accent);
    font-weight: 600;
    border-left: 3px solid var(--part1-accent);
    padding-left: 21px;
  }
  .part-2 .session-item.active {
    background: var(--part2-bg);
    color: var(--part2-accent);
    border-left-color: var(--part2-accent);
  }
  .session-num {
    display: inline-block;
    width: 24px;
    font-weight: 700;
    color: var(--muted2);
  }
  .session-item.active .session-num {
    color: inherit;
  }

  /* 메인 영역 */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 48px 64px;
  }
  .content-inner {
    max-width: 880px;
    margin: 0 auto;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    color: var(--muted);
  }
  .empty-state h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text);
  }

  /* 마크다운 렌더링 */
  .md h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .md h2 {
    font-size: 18px;
    font-weight: 700;
    margin: 32px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    letter-spacing: -0.01em;
  }
  .md h3 {
    font-size: 16px;
    font-weight: 700;
    margin: 24px 0 8px;
    padding: 12px 16px;
    background: var(--surface);
    border-left: 3px solid var(--part1-accent);
    border-radius: 0 6px 6px 0;
  }
  .part-2-content .md h3 { border-left-color: var(--part2-accent); }
  .md h4 {
    font-size: 14px;
    font-weight: 700;
    margin: 16px 0 6px;
    color: var(--text);
  }
  .md p {
    margin: 8px 0;
    font-size: 14px;
  }
  .md ul, .md ol {
    margin: 8px 0 8px 24px;
    font-size: 14px;
  }
  .md li {
    margin: 4px 0;
  }
  .md strong {
    font-weight: 700;
  }
  .md code {
    background: var(--surface2);
    color: var(--text);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;
    font-size: 13px;
  }
  .md pre {
    background: var(--code-bg);
    color: var(--code-text);
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 12px 0;
    font-size: 13px;
    line-height: 1.5;
  }
  .md pre code {
    background: transparent;
    color: inherit;
    padding: 0;
    font-size: 13px;
  }
  .md table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 13px;
  }
  .md th, .md td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
  }
  .md th {
    background: var(--surface2);
    font-weight: 700;
  }
  .md blockquote {
    border-left: 3px solid var(--border2);
    padding: 8px 16px;
    margin: 12px 0;
    color: var(--muted);
    font-style: italic;
  }
  .md hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }

  /* 회차 메타 배지 */
  .session-meta {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .meta-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
  }
  .meta-badge.part1 { background: var(--part1-bg); color: var(--part1-accent); border-color: var(--part1-border); }
  .meta-badge.part2 { background: var(--part2-bg); color: var(--part2-accent); border-color: var(--part2-border); }

  /* 로딩 */
  .loading {
    text-align: center;
    padding: 48px;
    color: var(--muted);
    font-size: 14px;
  }
  .error {
    padding: 24px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #dc2626;
    border-radius: 8px;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>16주 슬라이드 목차</h1>
      <p>각 회차 클릭해서 검토</p>
    </div>
    <nav class="sidebar-nav" id="nav"></nav>
  </aside>
  <main class="content" id="content">
    <div class="empty-state">
      <h2>왼쪽에서 회차를 선택하세요</h2>
      <p>16개 회차의 슬라이드 목차를 한 화면에서 검토할 수 있습니다.</p>
    </div>
  </main>
</div>

<script>
const SESSIONS = [
  { num: 1, title: 'AI로 웹 만드는 세계 — 청사진', concept: 'AI 시대 웹 만들기 청사진', part: 1 },
  { num: 2, title: 'HTML — 웹의 뼈대', concept: '구조 = HTML', part: 1 },
  { num: 3, title: 'CSS — 디자인 (색·폰트·여백)', concept: '스타일 = CSS', part: 1 },
  { num: 4, title: 'JS 인터랙션 기초', concept: '행동 = JS (3대 트리거)', part: 1 },
  { num: 5, title: '스크롤 라이브러리 (GSAP)', concept: '스크롤 트리거', part: 1 },
  { num: 6, title: '마우스 인터랙션', concept: '좌표 추적', part: 1 },
  { num: 7, title: '시각 라이브러리', concept: '라이브러리 = 이름만 알면 끝', part: 1 },
  { num: 8, title: 'v12 메타 + GitHub Pages 배포', concept: '인터넷에 내 사이트 띄우기', part: 1 },
  { num: 9, title: 'API 연동 (fetch + 외부 데이터)', concept: 'API 연동', part: 2 },
  { num: 10, title: '데이터 저장 (스키마 + LocalStorage)', concept: '데이터 구조화 + 저장', part: 2 },
  { num: 11, title: '클라우드 DB (Supabase CRUD)', concept: '클라우드 DB 연결', part: 2 },
  { num: 12, title: '회원 시스템 (Supabase Auth)', concept: '사용자 인증', part: 2 },
  { num: 13, title: '도메인 (구매·DNS·GitHub Pages 연동)', concept: '내 도메인 가지기', part: 2 },
  { num: 14, title: 'Vercel — DB·API 연동 환경', concept: 'Vercel 환경으로 옮기기', part: 2 },
  { num: 15, title: 'API 활용 (AI 기능 붙이기)', concept: '보호된 API 호출', part: 2 },
  { num: 16, title: '결제 (토스 PG) + 캡스톤 발표', concept: '결제 + 캡스톤 마무리', part: 2 },
];

const nav = document.getElementById('nav');
const content = document.getElementById('content');

function renderNav() {
  let html = '';
  ['1','2'].forEach(partNum => {
    const sessions = SESSIONS.filter(s => s.part === parseInt(partNum));
    html += `<div class="part-${partNum}">`;
    html += `<div class="part-header">Part ${partNum} — ${partNum === '1' ? '기초 8주 (랜딩+배포)' : '심화 8주 (데이터·결제)'}</div>`;
    sessions.forEach(s => {
      const num = String(s.num).padStart(2, '0');
      html += `<button class="session-item" data-num="${s.num}" data-part="${s.part}">`;
      html += `<span class="session-num">${num}</span>${s.title}`;
      html += `</button>`;
    });
    html += `</div>`;
  });
  nav.innerHTML = html;

  nav.querySelectorAll('.session-item').forEach(btn => {
    btn.addEventListener('click', () => loadSession(parseInt(btn.dataset.num)));
  });
}

async function loadSession(num) {
  nav.querySelectorAll('.session-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.num) === num);
  });

  const session = SESSIONS.find(s => s.num === num);
  const filename = `${String(num).padStart(2, '0')}_session${num}_slides.md`;

  content.innerHTML = `<div class="loading">불러오는 중…</div>`;

  try {
    const res = await fetch(filename);
    if (!res.ok) throw new Error(`${filename} 로드 실패 (${res.status})`);
    const md = await res.text();

    const html = marked.parse(md);
    const partClass = session.part === 1 ? 'part-1-content' : 'part-2-content';
    const partBadge = session.part === 1 ? 'part1' : 'part2';

    content.innerHTML = `
      <div class="content-inner ${partClass}">
        <div class="session-meta">
          <span class="meta-badge ${partBadge}">Part ${session.part} — ${session.part === 1 ? '기초' : '심화'}</span>
          <span class="meta-badge">Session ${num}</span>
          <span class="meta-badge">1개념 · ${session.concept}</span>
          <span class="meta-badge">2시간</span>
        </div>
        <div class="md">${html}</div>
      </div>
    `;

    window.scrollTo(0, 0);
    document.querySelector('.content').scrollTo(0, 0);
    location.hash = `#session${num}`;
  } catch (e) {
    content.innerHTML = `<div class="content-inner"><div class="error">불러오기 실패: ${e.message}<br><br>로컬 서버(http://)에서 열어야 합니다. file:// 직접 열기는 fetch 제한으로 동작 안 합니다.</div></div>`;
  }
}

renderNav();

// hash 라우팅
const initialHash = location.hash.match(/#session(\d+)/);
if (initialHash) {
  loadSession(parseInt(initialHash[1]));
} else {
  loadSession(1);
}
</script>
</body>
</html>
