<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SPARK.md A/B 비교 — 같은 프롬프트, 다른 결과</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #171717; background: #f9fafb; line-height: 1.6;
    padding: 2rem 1.25rem 3rem;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .badge {
    display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em;
    color: #fff; background: #171717; border-radius: 999px; padding: 0.25rem 0.7rem; margin-bottom: 1rem;
  }
  h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; }
  .lead { color: #6b7280; margin-top: 0.5rem; font-size: 1rem; }
  .lead strong { color: #16a34a; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-top: 1.75rem; }
  .col {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .col-head { padding: 0.9rem 1rem; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .col-tag { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; color: #9ca3af; }
  .col-title { font-size: 1.05rem; font-weight: 700; }
  .col-sub { font-size: 0.82rem; color: #6b7280; font-weight: 400; }
  .open-link {
    font-size: 0.8rem; font-weight: 600; color: #171717; text-decoration: none;
    border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.35rem 0.6rem; white-space: nowrap;
  }
  .open-link:hover { background: #f9fafb; }
  .frame { width: 100%; height: 70vh; min-height: 460px; border: 0; background: #fff; }
  .note { margin-top: 1.75rem; font-size: 0.85rem; color: #9ca3af; }
  @media (max-width: 800px) {
    .grid { grid-template-columns: 1fr; }
    h1 { font-size: 1.5rem; }
    .frame { height: 60vh; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">WEB 08 · 실습 A vs B</span>
    <h1>SPARK.md A/B 비교</h1>
    <p class="lead">두 페이지 모두 <strong>완전히 똑같은 프롬프트</strong>로 Claude가 자동 생성했습니다. 차이는 폴더에 CLAUDE.md(SPARK.md)가 있느냐 하나뿐.</p>

    <div class="grid">
      <div class="col">
        <div class="col-head">
          <div>
            <div class="col-tag">A · 맨손</div>
            <div class="col-title">SPARK.md 없음 <span class="col-sub">기본 결과</span></div>
          </div>
          <a class="open-link" href="a/" target="_blank" rel="noopener">새 탭 ↗</a>
        </div>
        <iframe class="frame" src="a/" title="A 맨손 결과" loading="lazy"></iframe>
      </div>

      <div class="col">
        <div class="col-head">
          <div>
            <div class="col-tag">B · SPARK.md 적용</div>
            <div class="col-title">CLAUDE.md = SPARK.md <span class="col-sub">기준표 투입</span></div>
          </div>
          <a class="open-link" href="b/" target="_blank" rel="noopener">새 탭 ↗</a>
        </div>
        <iframe class="frame" src="b/" title="B SPARK.md 결과" loading="lazy"></iframe>
      </div>
    </div>

    <p class="note">생성 도구: Claude Code (claude -p). 같은 프롬프트 · 같은 모델 · 폴더의 CLAUDE.md 유무만 다름. 스크롤하면 B는 등장 애니메이션이 동작합니다.</p>
  </div>
</body>
</html>
