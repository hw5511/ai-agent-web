<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김우희 | 웹 디자이너</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      color: #1a1a2e;
      background: #f4f5fb;
      line-height: 1.6;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 100px 24px 80px;
      background: linear-gradient(135deg, #6a5af9 0%, #a084ee 100%);
      color: #fff;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 1.2rem;
      opacity: 0.92;
    }

    .hero .role {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* Works */
    .works {
      padding: 80px 0;
    }

    .works h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 48px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 6px 24px rgba(106, 90, 249, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(106, 90, 249, 0.16);
    }

    .card .emoji {
      font-size: 2rem;
      margin-bottom: 16px;
    }

    .card h3 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .card p {
      color: #555;
      font-size: 0.95rem;
    }

    /* Contact */
    .contact {
      text-align: center;
      padding: 80px 24px 100px;
    }

    .contact h2 {
      font-size: 1.8rem;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-block;
      padding: 16px 40px;
      background: #6a5af9;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      border-radius: 999px;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: #5546d6;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: #999;
      font-size: 0.85rem;
    }

    @media (max-width: 720px) {
      .hero h1 { font-size: 2.2rem; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="container">
      <h1>안녕하세요, 김우희입니다</h1>
      <p>사용자의 경험을 가장 먼저 생각하는 디자인을 합니다.</p>
      <span class="role">웹 디자이너</span>
    </div>
  </header>

  <main>
    <section class="works">
      <div class="container">
        <h2>내가 한 일</h2>
        <div class="cards">
          <article class="card">
            <div class="emoji">🎨</div>
            <h3>브랜드 리디자인</h3>
            <p>스타트업의 웹사이트를 처음부터 다시 설계하여 방문자 체류 시간을 40% 늘렸습니다.</p>
          </article>
          <article class="card">
            <div class="emoji">📱</div>
            <h3>반응형 UI 설계</h3>
            <p>모바일과 데스크톱 모두에서 일관된 경험을 제공하는 디자인 시스템을 구축했습니다.</p>
          </article>
          <article class="card">
            <div class="emoji">🚀</div>
            <h3>랜딩페이지 제작</h3>
            <p>전환율을 고려한 랜딩페이지를 디자인하여 신규 가입 전환을 2배로 끌어올렸습니다.</p>
          </article>
        </div>
      </div>
    </section>

    <section class="contact">
      <h2>함께 일하고 싶으신가요?</h2>
      <a class="btn" href="mailto:woohee.kim@example.com">연락하기</a>
    </section>
  </main>

  <footer>
    &copy; 2026 김우희. All rights reserved.
  </footer>
</body>
</html>
